# ---- Campaigns ----
campaigns:
- name: Operation Cloud Hopper (MSP targeting)
  year_published: null
  description: >
    APT10's most significant campaign, targeting managed IT service providers (MSPs) worldwide
    as a supply-chain attack vector to reach their clients' networks. PwC and BAE Systems jointly
    reported the campaign in April 2017. APT10 compromised MSPs by exploiting their trusted
    network access and legitimate credentials (often with domain admin privileges) to "hop"
    into client networks across dozens of industries. Victims included major global MSPs
    (including HPE, IBM, and others per Reuters reporting), with affected organizations in
    the UK, US, Japan, India, Canada, Brazil, France, Norway, Finland, Switzerland, South Africa,
    and Australia. The UK NCSC issued an advisory urging organizations to demand evidence from
    their MSPs. A 2019 Reuters investigation revealed the campaign was significantly larger
    than initially reported, with HPE fighting the attackers for at least five years.
  targets:
    sectors: [technology, government, defense, healthcare, finance, energy, manufacturing]
    regions: [United States, United Kingdom, Japan, India, Canada, Brazil, Europe, Australia, South Africa]
  sources:
  - url: https://web.archive.org/web/20220224041316/https:/www.pwc.co.uk/cyber-security/pdf/cloud-hopper-report-final-v4.pdf
    title: "Operation Cloud Hopper"
    publisher: PwC UK / BAE Systems
  - url: https://www.justice.gov/opa/pr/two-chinese-hackers-associated-ministry-state-security-charged-global-computer-intrusion
    title: "Two Chinese Hackers Associated With the Ministry of State Security Charged"
    publisher: U.S. Department of Justice

- name: Japanese organizations targeting campaign
  year_published: null
  description: >
    APT10 has maintained a persistent focus on Japanese organizations throughout its operational
    history. This includes targeting of Japanese academic and industrial entities (documented
    by Palo Alto Unit 42 in 2017), Japanese corporations with the UPPERCUT/ANEL and SNUGRIDE
    backdoors (FireEye 2018), and Japanese firms and their subsidiaries in 17 locations
    exploiting the Zerologon vulnerability (Symantec 2020). APT10's Japanese targeting has
    used dedicated malware families (ChChes) and C2 domains spoofing legitimate Japanese
    organizations.
  targets:
    sectors: [government, defense, aerospace, healthcare, technology, maritime, education]
    regions: [Japan]
  sources:
  - url: http://researchcenter.paloaltonetworks.com/2017/02/unit42-menupass-returns-new-malware-new-attacks-japanese-academics-organizations/
    title: "menuPass Returns with New Malware and New Attacks Against Japanese Academics and Organizations"
    publisher: Palo Alto Networks Unit 42
  - url: https://www.fireeye.com/blog/threat-research/2018/09/apt10-targeting-japanese-corporations-using-updated-ttps.html
    title: "APT10 Targeting Japanese Corporations Using Updated TTPs"
    publisher: FireEye

- name: U.S. government and Navy data theft (DOJ Indictment)
  year_published: null
  description: >
    Per the DOJ indictment, APT10 conducted intrusions against at least 45 technology companies
    and U.S. government agencies over 12 years, stealing intellectual property, confidential
    business data, and personally identifiable information (PII) of more than 100,000 U.S.
    Navy personnel including social security numbers, dates of birth, and salary information.
    Targeted industries included aviation, satellite technology, pharmaceutical, computer
    processor, automotive, oil and gas exploration, and manufacturing. The group also
    compromised NASA, JPL, and the U.S. Attorney's Office in SDNY.
  targets:
    sectors: [government, defense, aerospace, healthcare, technology, maritime, education]
    regions: [Japan]
  sources:
  - url: https://nsarchive.gwu.edu/sites/default/files/documents/5691919/United-States-of-America-v-Zhu-Hua-and-Zhang.pdf
    title: "United States of America v. Zhu Hua and Zhang Shilong"
    publisher: U.S. Department of Justice

- name: Global espionage expansion (Cicada 2021-2022)
  year_published: null
  description: >
    Symantec documented APT10/Cicada targeting government, legal, religious, and NGO entities
    across the U.S., Canada, Hong Kong, Turkey, Israel, India, Montenegro, and Italy. The group
    exploited unpatched Microsoft Exchange Server vulnerabilities for initial access and deployed
    the SodaMaster backdoor and a custom loader via VLC Media Player DLL side-loading. Attackers
    maintained persistence on some networks for up to nine months. This campaign represented a
    significant broadening of APT10's target scope beyond its traditional Japanese focus.
  targets:
    sectors: [government, legal, NGOs, education, telecommunications]
    regions: [United States, Canada, Hong Kong, Turkey, Israel, India, Italy, Montenegro]
  sources:
  - url: https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/cicada-apt10-china-ngo-government-attacks
    title: "Cicada: Chinese APT Group Widens Targeting in Recent Espionage Activity"
    publisher: Symantec

