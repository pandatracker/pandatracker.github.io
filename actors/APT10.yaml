# ---- Overview ----
description: >
  APT10 is a Chinese state-sponsored cyber espionage group affiliated with the MSS's Tianjin State Security Bureau, operating through the front company Huaying Haitai. 

  Active since at least 2006, (U.S. DOJ, 2018) APT10 initially focused on the U.S. defense industrial base and Japanese organizations (FireEye/Mandiant, 2017) before expanding
  its scope with Operation Cloud Hopper, a supply-chain campaign targeting managed IT service providers (MSPs) worldwide to gain access to their clients' networks. (PwC & BAE, 2017)
  
  This MSP compromise gave APT10 access to intellectual property across dozens of
  industries in at least a dozen countries. The group has also conducted extensive direct targeting of
  Japanese private and government organizations. (PwC & BAE, 2017) 

  Two members (Zhu Hua and Zhang Shilong) were indicted by the DOJ in December 2018, and the group was sanctioned
  by the EU in 2020. Despite these actions, APT10 appears to have continued operations, with Symantec (2022) documenting
  global espionage campaigns as recently as 2022 using updated tooling including the SodaMaster backdoor, and Kaspersky (2022) associating APT10 with
  2022 LODEINFO malware campaign targeting Japanese government orgs.

