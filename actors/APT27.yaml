affiliation_detail: >
  In March 2025, the DOJ unsealed indictments identifying two APT27 members:
  Yin Kecheng (active since 2013, linked to the MSS) and Zhou Shuai/"Coldface"
  (a first-generation Chinese patriotic hacker from the 1990s who operated
  through his company Shanghai Heiying). According to the indictment, both operated as freelancers/contractors,
  conducting intrusions for the MSS and MPS while also hacking for personal
  profit and selling stolen data through i-Soon — the Chinese hacking-for-hire
  firm exposed by a February 2024 document leak.

  Earlier attribution was based on circumstantial evidence: SecureWorks (2015)
  assessed with "moderate confidence" that TG-3390 has a Chinese nexus based on
  targeting patterns (including Uyghur cultural websites), operating hours, tool
  selection (PlugX with Chinese-language menus), and infrastructure linked to
  PRC-based ISPs. Kaspersky (2018) attributed the LuckyMouse data center campaign
  based on tools, domains, and TTPs consistent with Chinese-speaking actors.
