- name: HyperBro RAT Campaign
  year_published: 2022
  description: >
    According to Hive Pro, APT27 targeted against at
    least nine organizations across critical sectors worldwide from March to mid-September 2021. In January 2022, Germany's
    BfV warned that APT27 had been attacking German companies using these
    same vectors. The BfV assessed the intrusions focused on stealing business secrets and
    intellectual property, with potential supply chain attack attempts
    against victims' customers.
  targets:
    sectors: [defense, healthcare, energy, technology, education]
    regions: [United States, Germany, Europe]
  sources:
  - url: https://hivepro.com/threat-advisory/apt27-group-uses-the-hyperbro-remote-access-trojan-to-inject-backdoors-into-victims-network/
    title: "APT27 Group Uses the HyperBro Remote Access Trojan"
    publisher: Hive Pro
  - url: https://us-cert.cisa.gov/ncas/alerts/aa21-259a
    title: "APT Actors Exploiting Newly Identified Vulnerability in ManageEngine ADSelfService Plus"
    publisher: CISA / FBI / CGCYBER

- name: US Treasury Department Breach (Silk Typhoon / BeyondTrust)
  year_published: 2025
  description: >
    In what became APT27's most high-profile operation, actors linked to
    Silk Typhoon/APT27 (subsequently identified as Yin Kecheng) compromised
    BeyondTrust's Remote Support SaaS platform beginning around September
    2024. The breach, discovered by BeyondTrust on December 2,
    2024, affected over 3,000 unclassified files across approximately
    100 Treasury computers. Compromised offices included the Office of
    Foreign Assets Control (OFAC) — which administers US sanctions —
    and the Office of Financial Research. Files related to senior
    officials including Secretary Janet Yellen and Deputy Secretary
    Wally Adeyemo were reportedly compromised. The targeting of OFAC
    is particularly significant given China's strategic interest in
    understanding and potentially circumventing US sanctions enforcement.
    Microsoft published a concurrent report linking Silk Typhoon to
    IT supply chain targeting and an Ivanti VPN zero-day (CVE-2025-0282).
    Yin Kecheng was sanctioned in January 2025; both Yin and Zhou Shuai
    were indicted in March 2025.
  targets:
    sectors: [government]
    regions: [United States]
  sources:
  - url: https://www.justice.gov/usao-dc/pr/chinese-nationals-ties-prc-government-and-apt27-charged-computer-hacking-campaign-profit
    title: "Chinese Nationals with Ties to the PRC Government and 'APT27' Charged"
    publisher: U.S. Department of Justice
  - url: https://home.treasury.gov/news/press-releases/jy2792
    title: "Treasury Sanctions Chinese Hacker Associated with Treasury Compromise"
    publisher: U.S. Department of the Treasury

