# ---- Campaigns ----
campaigns:
- name: TG-3390 Cyberespionage Campaign
  year_published: 2015
  description: >
    Campaign documented across SecureWorks' three reports
    (2015, 2017, 2019). APT27/TG-3390/BRONZE UNION conducted sustained
    espionage operations targeting organizations across multiple sectors
    worldwide.
    SecureWorks assessed the group aimed to collect defense technology and
    capability intelligence, industrial intelligence, and political intelligence
    from governments and NGOs. Despite the 2015 public disclosure, BRONZE UNION
    continued operations, adapting tools and techniques.
  targets:
    sectors: [government, defense, technology, manufacturing, energy, NGOs]
    regions: [United States, Europe, Middle East]
