- name: Gambling Sector Targeting
  year_published: 2020-2021
  description: >
    Beginning in 2019, Trend Micro (working with Talent-Jump) investigated
    APT27's targeting of gambling companies, initially
    uncovering what they called Operation DRBControl. 
    In 2020, Profero/Security Joes similarly documented the group's pivot. Positive Technologies separately
    attributed a Polar ransomware attack (April 2020) to APT27. Profero
    noted the financial pivot was "unusual" for a cyberespionage group,
    speculating COVID-19 lockdowns may have motivated the shift. By 2023,
    Trend Micro confirmed continued targeting of Philippines-based gambling
    companies with updated SysUpdate (including Linux variants with DNS
    tunneling).
  targets:
