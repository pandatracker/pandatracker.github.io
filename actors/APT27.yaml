- name: Operation Iron Tiger
  year_published: 2015
  description: >
    Trend Micro documented APT27/Iron Tiger shifting targets from East Asia
    to the United States, primarily targeting US defense contractors. The
    September 2015 report detailed the group's toolkit and operational
    patterns for stealing defense technology data. The campaign was notable
    for coinciding with APT27's broader expansion of targeting scope during
    this period.
  targets:
    sectors: [defense, aerospace, technology]
    regions: [United States]
  sources:
  - url: https://www.erai.com/CustomUploads/ca/wp/2015_12_wp_operation_iron_tiger.pdf
    title: "Operation Iron Tiger: Exploring Chinese Cyber-Espionage Attacks on United States Defense Contractors"
    publisher: Trend Micro

- name: Central Asian National Data Center Compromise (Mongolia)
  year_published: 2018
  description: >
    Kaspersky discovered in March 2018 that APT27/LuckyMouse had compromised
    a national data center in Central Asia (subsequently identified by
    CyberScoop as Mongolia) beginning around October 2017. Through the data
    center, the group gained access to a wide range of government resources
    and injected malicious JavaScript into official government websites to
    conduct watering hole attacks, redirecting visitors to attacker domains.
  targets:
    sectors: [government, national-data-center]
    regions: [Mongolia]
  sources:
  - url: https://securelist.com/luckymouse-hits-national-data-center/86083/
