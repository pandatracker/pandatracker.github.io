# ---- Overview ----
description: >
  APT27 is a Chinese state-associated cyber espionage group active since at
  least 2010. The DOJ's March 2025 indictments allege conduct "from
  2011 to the present-day" and describes the group "as freelancers" who "conducted computer
  intrusions at the direction of the PRC's MPS and MSS and on their own initiative." The group is tracked under an unusually large number of aliases —
  at least 16 by Malpedia's count.
  
  APT27 targets a broad range of sectors including government, defense,
  aerospace, technology, energy, manufacturing, telecommunications, and
  gambling, with victims across North America, Europe, the Middle East,
  and Asia-Pacific. The group has also targeted Uyghur community websites
  and dissidents. 

  Profero/Security Joes (2020) researchers observed "extremely strong links" between APT27 and a financially motivated threat actor deploying
  ransomware against gambling companies around 2020. This shift in focus was also noticed by TrendMicro/TalentJump (2020-2021) and PT Security (2020).

  APT27 is associated with large number of campaigns, recently for the December 2024 breach of the US Treasury Department. 
  In July 2024, German domestic intelligence services BfV warned that APT27 was attacking European entities using new RSHELL variants.

