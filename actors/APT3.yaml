# ---- Overview ----
description: >
  APT3 is a state-sponsored group attributed to the Ministry of State Security (MSS), operating
  through the entity Guangzhou Boyu Information Technology Company (Boyusec) as a contractor.

  Active from at least 2009 to mid-2017, the group initially targeted a broad range of U.S. organizations across the defense,
  telecommunications, transportation, technology, and aerospace sectors for the goal of intellectual property extraction,
  before shifting focus to political
  organizations in Hong Kong around mid-2015. (Intrustion Truth, 2017; Symantec, 2015)

  APT3 was notable for its technical sophistication, including the use of zero-day exploits in Internet Explorer and Adobe
  Flash, and was discovered to have obtained and
  used variants of NSA Equation Group tools (DoublePulsar) at least a year before the Shadow Brokers leak.

  The group was responsible for Operations Clandestine Fox, Clandestine Wolf, and Double Tap. In May 2017,
  Intrusion Truth linked APT3 to Boyusec and the MSS, corroborated by Recorded Future
  and FireEye. The DOJ indicted three Boyusec employees in November 2017, and Boyusec was subsequently
  disbanded. 

  APT3 activity has not been observed since May 2017. (Intrusion Truth, 2017; WSJ, 2017)

