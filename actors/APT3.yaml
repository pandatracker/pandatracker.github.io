# ---- Campaigns ----
campaigns:
- name: Operation Clandestine Fox
  year_published: null
  description: >
    APT3 exploited a zero-day vulnerability in Internet Explorer (CVE-2014-1776, affecting
    versions 9 through 11) in targeted attacks against U.S. organizations. The group used
    spear-phishing emails to deliver exploits and deployed the Pirpi backdoor via DLL
    side-loading using a legitimate Chrome binary. FireEye published a follow-up "Clandestine
    Fox Part Deux" documenting the group's rapid adaptation after initial disclosure.
  targets:
    sectors: [defense, technology]
    regions: [United States]
  sources:
  - url: 
      https://www.fireeye.com/blog/threat-research/2014/04/new-zero-day-exploit-targeting-internet-explorer-versions-9-through-11-identified-in-targeted-attacks.html
    title: "New Zero-Day Exploit targeting Internet Explorer Versions 9 through 11"
    publisher: FireEye
  - url: https://www.fireeye.com/blog/threat-research/2014/06/clandestine-fox-part-deux.html
    title: "Clandestine Fox, Part Deux"
    publisher: FireEye

- name: Operation Double Tap
  year_published: null
  description: >
    APT3 used two known vulnerabilities (CVE-2014-6332 in Windows OLE and CVE-2014-4113 in
    Windows kernel) in a spear-phishing campaign. The group established persistence via
    registry Run keys and startup folder scripts, used PowerShell for payload delivery, and
    employed SOCKS5-based multi-stage C2 channels. This represented a shift toward using known
    exploits combined with social engineering rather than zero-days.
  targets:
    sectors: []
    regions: [United States]
  sources:
  - url: https://www.fireeye.com/blog/threat-research/2014/11/operation_doubletap.html
    title: "Operation Double Tap"
    publisher: FireEye

- name: Operation Clandestine Wolf
  year_published: null
  description: >
    APT3 exploited an Adobe Flash Player zero-day vulnerability (CVE-2015-3113) as part of a
    phishing campaign targeting organizations in the U.S. aerospace, defense, construction and
    engineering, technology, telecommunications, and transportation sectors, as well as U.S.
    government agencies.
  targets:
    sectors: [aerospace, defense, technology, telecommunications, transportation, government]
    regions: [United States]
  sources:
  - url: https://cloud.google.com/blog/topics/threat-intelligence/operation-clandestine-wolf-adobe-flash-zero-day/
    title: "Operation Clandestine Wolf – Adobe Flash Zero-Day in APT3 Phishing Campaign"
    publisher: FireEye

- name: Hong Kong targeting shift
  year_published: null
  description: >
    Around mid-2015, APT3 shifted its primary targeting from U.S. organizations to political
    organizations and entities in Hong Kong. Symantec documented this shift in September 2016.
    The change may have been partially driven by increased U.S.-China tensions and the 2015
    Obama-Xi cyber agreement.
  targets:
    sectors: [government, NGOs]
    regions: [Hong Kong]
  sources:
  - url: http://www.symantec.com/connect/blogs/buckeye-cyberespionage-group-shifts-gaze-us-hong-kong
    title: "Buckeye cyberespionage group shifts gaze from US to Hong Kong"
    publisher: Symantec

- name: Siemens, Moody's Analytics, and Trimble intrusions (DOJ Indictment)
  year_published: null
  description: >
    Three Boyusec employees (Wu Yingzhuo, Dong Hao, Xia Lei) conducted sustained intrusions
    against Siemens AG, Moody's Analytics, and GPS/surveying company Trimble Inc., stealing
    hundreds of gigabytes of sensitive data including trade secrets, proprietary technology,
    and confidential business information in the finance, engineering, and technology sectors.
    Wu hacked Trimble, Dong hacked Siemens, and Xia hacked Moody's Analytics.
  targets:
    sectors: [technology, finance, manufacturing]
    regions: [United States, Germany]
  sources:
  - url: https://www.justice.gov/opa/press-release/file/1013866/download
    title: "United States of America v. Wu Yingzhuo, Dong Hao, Xia Lei"
    publisher: U.S. Department of Justice

- name: Equation Group tool usage campaign
  year_published: null
  description: >
    Beginning March 2016, APT3 deployed a variant of the NSA Equation Group's DoublePulsar
    backdoor via its custom Bemstour exploit tool—at least a year before the Shadow Brokers
    leaked these tools publicly. Initial attacks targeted organizations in Hong Kong, followed
    by targets in Belgium, Luxembourg, Vietnam, and the Philippines. The DoublePulsar variant
    differed from the later leaked version, suggesting APT3 may have reverse-engineered it from
    captured network traffic. Bemstour and DoublePulsar continued to be used until at least
    September 2018, after APT3's apparent dissolution, raising questions about tool handoff to
    other groups.
  targets:
    sectors: [telecommunications, education]
    regions: [Hong Kong, Luxembourg, Philippines, Vietnam]
  sources:
  - url: https://www.symantec.com/blogs/threat-intelligence/buckeye-windows-zero-day-exploit
    title: "Buckeye: Espionage Outfit Used Equation Group Tools Prior to Shadow Brokers Leak"
    publisher: Symantec

