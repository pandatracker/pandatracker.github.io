# ---- Overview ----
description: >
  APT1 is a Chinese state-sponsored cyber espionage group attributed to PLA Unit 61398, the 2nd Bureau of the
  PLA General Staff Department's 3rd Department, based in Shanghai's Pudong district. The group is the subject of the
  first-ever U.S. criminal indictment against state actors for cyber espionage.

  Between 2006 and 2013, Mandiant observed APT1 compromise at least 141
  organizations across 20 major industries, "systematically stolen hundreds
  of terabytes of data," with the capability "to steal from dozens of
  organizations simultaneously." The group maintained persistent access
  for an average of 356 days per victim, with the longest single intrusion
  lasting 1,764 days (four years and ten months). The largest observed
  single theft was 6.5 terabytes of compressed data from one organization
  over ten months. Of the 141 known victims, 87% were headquartered in
  English-speaking countries, with 115 in the United States. Targeted
  industries aligned with China's 12th Five-Year Plan strategic
  priorities. (Mandiant, 2013)

  The aliases including "comment" were derived from the group's utilization
  of C2 instructions embedded in HTML comment tags on legitimate-looking web pages. 
  Later, APT1 also utilized other tags. (Mandiant, 2013)

  APT1 infrastructure was largely dismantled following the February 2013
  Mandiant report.

