  description: >
    Five PLA Unit 61398 officers (Wang Dong, Sun Kailiang, Wen Xinyu, Huang Zhenyu, Gu Chunhui)
    conducted sustained cyber intrusions against six U.S. entities—Westinghouse Electric, SolarWorld AG
