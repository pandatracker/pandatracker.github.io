# ---- Overview ----
description: >
  APT1 is a Chinese state-sponsored cyber espionage group attributed to PLA Unit 61398, the 2nd Bureau of the
  PLA General Staff Department's 3rd Department, based in Shanghai's Pudong district. 

  Active from at least 2006,the group conducted sustained intrusions against at least 141 organizations across 20 major industries,  with
  a primary focus on English-speaking targets, particularly in the United States. 

  APT1 was notable for its economic espionage operations, stealing hundreds of terabytes of data including trade
  secrets, business plans, and proprietary technology. The group maintained persistence in victim networks for an average
  of one year, with the longest known access lasting four years and ten months. 

  The 2013 Mandiant report publicly linked the group to the PLA, followed by the 2014 DOJ indictment of five Unit 61398 officers
  — the first-ever U.S. criminal charges against known state actors for cyber espionage.

