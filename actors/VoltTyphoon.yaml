# ---- Overview ----
description: >
  According to the publicly available information, Volt Typhoon is assessed to be  a PRC state-sponsored group focused on
  pre-positioning within U.S. critical infrastructure for potential disruption or
  destruction during a future geopolitical crisis. (CISA, 2024)
  
  Active since at least
  mid-2021, the group has compromised organizations in communications,
  energy, water, transportation, manufacturing, maritime, construction,
  government, IT, and education, with focus on strategic locations, including Guam. (Microsoft, 2023)

  Volt Typhoon's behavior is not consistent with traditional espionage.
  CISA (2024) assessed the group is seeking to pre-position on IT networks for
  lateral movement to OT assets, collecting ICS/SCADA documentation
  including network diagrams and operations manuals.

  According to Microsoft TI (2023), the group relies on living-off-the-land techniques — using native Windows tools, hands-on-keyboard activity,
  and stolen valid credentials rather than deploying custom malware.
  Traffic is routed through the KV Botnet, a network of compromised
  end-of-life SOHO routers (primarily Cisco and NETGEAR) that makes
  attack traffic appear to originate from legitimate U.S. IP addresses.
  Initial access typically exploits vulnerabilities in internet-facing
  Fortinet, Ivanti, NETGEAR, Citrix, and Cisco devices.

  In January 2024, the FBI disrupted the KV Botnet via court-authorized
  operation, removing malware from hundreds of SOHO routers.

