# ---- Campaigns ----
campaigns:
- name: U.S. Critical Infrastructure Pre-Positioning
  year_published: null
  description: >
    Sustained campaign targeting critical infrastructure in Guam and
    across the continental U.S. Compromised telecom companies, satellite
    operators, utilities, water systems, and transportation hubs.
    Initial access via Fortinet FortiGuard and other internet-facing
    appliance vulnerabilities. CISA confirmed five-year persistence in
    some environments and collection of ICS/SCADA documentation.
    Microsoft and the U.S. government assessed the activity as
    pre-positioning for potential disruption during a future crisis,
    particularly regarding Taiwan scenarios.
  targets:
    sectors: [communications, energy, water-and-wastewater, transportation, government, maritime]
    regions: [United States]
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2023/05/24/volt-typhoon-targets-us-critical-infrastructure-with-living-off-the-land-techniques/
    title: "Volt Typhoon Targets US Critical Infrastructure"
    publisher: Microsoft
  - url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-038a
    title: "AA24-038A Joint Advisory"
    publisher: CISA / NSA / FBI / Five Eyes

- name: KV Botnet Operations
  year_published: null
  description: >
    Construction and operation of the KV Botnet — a covert relay
    network of compromised SOHO routers used to proxy attack traffic
    and conceal origins. Black Lotus Labs documented the botnet in
    December 2023. FBI disrupted it via court order in January 2024,
    removing malware from hundreds of routers. Volt Typhoon rapidly
    rebuilt the infrastructure. SecurityScorecard reported 30% of
    Cisco RV320/325 devices compromised in 37 days.
  targets:
    sectors: [technology]
    regions: [United States]
  sources:
  - url: https://blog.lumen.com/routers-roasting-on-an-open-firewall-the-kv-botnet-investigation/
