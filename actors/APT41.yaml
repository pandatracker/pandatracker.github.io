# ---- Campaigns ----
campaigns:
- name: Video Game Industry Targeting and Virtual Currency Theft
  year_published: null
  description: >
    APT41's financially motivated campaign,
    targeting video game development studios, distributors, and publishers.
    The group manipulated virtual currencies, stole in-game resources for
    real-world sale, and stole source code and digital certificates.
  targets:
    sectors: [video-games, technology]
    regions: [United States, South Korea, Japan, Singapore, Taiwan]
  sources:
  - url: https://services.google.com/fh/files/misc/apt41-a-dual-espionage-and-cyber-crime-operation.pdf
    title: "APT41, A DUAL ESPIONAGE AND CYBER CRIME OPERATION"
    publisher: FireEye / Mandiant

- name: Supply Chain Attacks (NetSarang, ASUS)
  year_published: null
  description: >
    APT41's most technically sophisticated campaigns, compromising
    software vendor build environments to distribute backdoored updates.
    The 2017 CCleaner attack distributed trojanized software to
    approximately 2.2 million users, with ShadowPad deployed selectively
    using MAC address filtering against approximately 11 technology
    companies. The 2017 NetSarang attack injected ShadowPad into the
    Xmanager and Xshell server management tools. The 2019 ASUS
    ShadowHammer attack distributed backdoored ASUS Live Update signed
    with legitimate certificates, targeting approximately 600 specific
    MAC addresses. All three attacks demonstrated surgical precision
    within mass distribution.
  targets:
    sectors: [technology, manufacturing]
    regions: [global]
  sources:
  - url: https://securelist.com/operation-shadowhammer/89992/
    title: "Operation ShadowHammer"
    publisher: Kaspersky Lab
  - url: https://www.sentinelone.com/labs/shadowpad-a-masterpiece-of-privately-sold-malware-in-chinese-espionage/
    title: "ShadowPad: A Masterpiece of Privately Sold Malware"
    publisher: SentinelOne
  - url: https://services.google.com/fh/files/misc/apt41-a-dual-espionage-and-cyber-crime-operation.pdf
    title: "APT41, A DUAL ESPIONAGE AND CYBER CRIME OPERATION"
    publisher: FireEye / Mandiant


- name: Mass Exploitation Campaign (Citrix/Cisco/Zoho)
  year_published: null
  description: >
    Between January and March 2020, APT41 launched a sweeping campaign
    exploiting recently disclosed vulnerabilities in Citrix ADC
    (CVE-2019-19781), Cisco RV320 routers, and Zoho ManageEngine
    Desktop Central (CVE-2020-10189). FireEye described it as one of
    the most widespread campaigns from a China-nexus espionage actor in
    recent years, targeting at least 75 organizations across banking,
    defense, government, healthcare, high-tech, manufacturing, oil and
    gas, pharmaceuticals, telecommunications, and transportation in
    over 20 countries.
  targets:
    sectors: [government, healthcare, telecommunications, defense, finance, manufacturing, energy, pharmaceuticals, 
        transportation]
    regions: [United States, United Kingdom, Australia, Canada, France, India, Italy, Japan, Singapore, Sweden, 
        Switzerland, UAE]
  sources:
