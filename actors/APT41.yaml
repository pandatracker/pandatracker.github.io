- name: Global Espionage Campaigns (Group-IB 2021)
  year_published: null
  description: >
    Group-IB documented four distinct APT41 campaigns in 2021,
    resulting in approximately 80 proactive notifications to affected
    organizations worldwide. The campaigns used Cobalt Strike
    infrastructure for C2 and targeted government and private sector
    entities. Work schedule analysis confirmed operators working 9 AM
    to 7 PM in the UTC+8 time zone (consistent with Chengdu).
  targets:
    sectors: [government, technology, telecommunications]
    regions: [global]
  sources:
