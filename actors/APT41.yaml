    title: "Chinese Hacker Group APT41 Uses Recent Exploits"
    publisher: CSO Online
  - url: https://cloud.google.com/blog/topics/threat-intelligence/apt41-initiates-global-intrusion-campaign-using-multiple-exploits/
    title: "This Is Not a Test: APT41 Initiates Global Intrusion Campaign Using Multiple Exploits"
    publisher: FireEye/Mandiant

- name: U.S. State Government Targeting
  year_published: null
  description: >
    Mandiant documented a sustained campaign targeting U.S. state
    government networks. APT41 exploited vulnerabilities in internet-facing
    web applications, including a zero-day in a commercial animal health
    management application, and deployed the DEADEYE dropper with LOWKEY
    backdoor.
  targets:
