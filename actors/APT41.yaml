affiliation_detail: >
  In September 2020, the DOJ unsealed charges against five Chinese
  nationals and two Malaysian accomplices in connection with APT41's
  operations. Three defendants were employees of the front company Chengdu
  404 Network Technology (成都肆零肆网络科技有限公司), a purported network security
  firm based in Chengdu, Sichuan Province. Intercepted communications revealed one
  defendant boasting of close relationships with both the MSS and MPS.
  The indictments covered attacks against over 100 organizations worldwide,
  including supply chain compromises, ransomware attacks (including against
  a non-profit combating global poverty), and theft of source code, digital
  certificates, and customer data.

  The two Malaysian nationals were arrested in Malaysia in September 2020 for conspiring with
  APT41 members to profit from video game company intrusions. All five
  Chinese defendants remain at large.
