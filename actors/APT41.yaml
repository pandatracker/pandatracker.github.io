# ---- Overview ----
description: >
  APT41 is a Chinese state-sponsored threat group characterized by conducting state-directed cyber espionage aligned with
  China's strategic intelligence requirements while simultaneously engaging
  in cybercrime activities. (FireEye, 2019) Active since at least 2012, APT41 has targeted organizations in at least 14
  countries across large number of industries. According to U.S. DOJ, APT41 operated through the
  front company Chengdu 404 Network Technology and was reportedly connected to both MSS and MPS.
  
  APT41 is known for its usage of software supply chain attacks, compromising software development environments and injecting
  malicious code into trusted update mechanisms. FireEye (2019) attributes the
  2017 NetSarang ShadowPad compromise, and the 2019 ASUS Live Update utility (ShadowHammer) to APT41. The 2017 CCleaner compromise,
  while overlapping with APT41 TTPs, is not definitely attributed to the group by FireEye.

  SentinelOne's 2021 research identified APT41 as comprising two
  sub-groups: BARIUM, responsible for the
  major supply chain attacks (NetSarang, ASUS ShadowHammer and allegedlly CCleaner);
  and LEAD, conducting broader espionage and financial operations. Both sub-groups are, according to the authors, based in Chengdu.

  In February 2026 Google Threat Intelligence Group (GTIG) observed APT41 misusing Google Gemini AI to accelerate 
  the development and deployment of malicious tooling, including for knowledge synthesis, real-time troubleshooting, and code translation." 

