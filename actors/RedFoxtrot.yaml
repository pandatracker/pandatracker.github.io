affiliation_detail: >
  Recorded Future's Insikt Group identified "specific ties" between
  RedFoxtrot and PLA Unit 69010 "with high confidence." The connection
  stemmed from "lax operational security measures" by a suspected
  RedFoxtrot operator, whose online persona disclosed the physical
  address of Unit 69010 and had a history of affiliation with the PLA's
  Communications Command Academy in Wuhan. (Recorded Future, 2021)

  The unit is located in Ürümqi, Xinjiang,
  and its operational remit aligns with RedFoxtrot's targeting of Central
  Asia, South Asia, and bordering countries — regions directly relevant
  to China's western border security, Belt and Road Initiative (BRI)
  infrastructure, and counterterrorism interests in Xinjiang. (Recorded
  Future, 2021)

  No individuals have been indicted. 

