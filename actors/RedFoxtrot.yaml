# ---- Overview ----
description: >
  RedFoxtrot is a PLA-linked cyber espionage group active since at least
  2014, attributed by Recorded Future with high confidence to PLA Unit 69010 based
  in Ürümqi, Xinjiang. The group predominantly targets government, defense,
  telecommunications, aerospace, mining, and research organizations across
  Central Asia, South Asia, and China's western border countries. (Recorded Future, 2021)

  In 2022, SentinelLabs documented overlapping activity under the name
  "Moshen Dragon," targeting Central Asian telecom providers. Moshen Dragon
  was notable for systematically abusing security vendor software — from
  Symantec, TrendMicro, BitDefender, McAfee, and Kaspersky — to sideload
  ShadowPad and PlugX variants via DLL search order hijacking. SentinelLabs
  noted the overlap with RedFoxtrot and Nomad Panda but did not make a
  definitive merge. (SentinelLabs, 2022) 
  
  In Relation to SentinelLabs report, it is worth departing slightly from 
  the otherwise descriptive purpose of this project and insert a one-sentence note.
  Coincidence that PLA Unit 61419 (Tick) procured all of this software a year earlier? (see Tick: Recoded Future, 2021) 

  Broadcom's April 2025 "Relentless Force" report reported continued
  activity, tracking the group as Needleminer and documenting use of
  the Quickheal backdoor with updated configuration and VMProtect
  obfuscation — "almost identical to Quickheal variants documented by
  Recorded Future in 2021." (Broadcom, 2025) The group has operated
  alongside Naikon and other Chinese groups in coordinated campaigns
  against Southeast Asian telecoms. (Broadcom, 2025)

