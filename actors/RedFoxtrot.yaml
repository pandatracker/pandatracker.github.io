# ---- Campaigns ----
campaigns:
  - name: India-Focused Espionage (Galwan Tensions)
    year_published: 2021
    description: >
      Recorded Future documented a six-month period in which RedFoxtrot
      showed "a particular focus on Indian targets, which occurred at a
      time of heightened border tensions between India and the People's
      Republic of China" following the June 2020 Galwan Valley clash.
      Intrusions targeted three Indian aerospace and defense contractors,
      major telecom providers in India, and government agencies. The
      group used Icefog, PlugX, Royal Road, and Poison Ivy for
      initial access and persistence. (Recorded Future, 2021)
    targets:
      sectors: [aerospace, defense, telecommunications, government]
      regions: [India]
    sources:
      - url: https://www.recordedfuture.com/research/redfoxtrot-china-pla-targets-bordering-asian-countries
        title: "RedFoxtrot Linked to China's PLA Unit 69010"
        publisher: Recorded Future / Insikt Group

  - name: Central Asian Telecom Targeting (Moshen Dragon)
    year_published: 2022
    description: >
      SentinelLabs documented Chinese-aligned cyberespionage targeting
      the telecommunications sector in Central Asia under the Moshen
      Dragon designation. The group deployed five DLL sideloading triads
      abusing security vendor software — including Symantec, TrendMicro,
      BitDefender, McAfee, and Kaspersky products — to load ShadowPad
      and PlugX variants. Additional tools included an LSA notification
      package for credential harvesting and the GUNTERS passive backdoor.
      Activity partially overlaps with RedFoxtrot and Nomad Panda.
      (SentinelLabs, 2022)
    targets:
      sectors: [telecommunications]
      regions: [Central Asia]
    sources:
      - url: https://www.sentinelone.com/labs/moshen-dragons-triad-and-error-approach-abusing-security-software-to-sideload-plugx-and-shadowpad/
        title: "Moshen Dragon's Triad-and-Error Approach"
        publisher: SentinelOne / SentinelLabs

  - name: Central and South Asian Government and Telecom Intrusions
    year_published: 2021
    description: >
      Beyond India, Recorded Future documented RedFoxtrot intrusions
      against major telecommunications providers in Afghanistan,
      Kazakhstan, and Pakistan, and multiple government agencies across
      Central Asia. The targeting aligns with the operational remit of
      PLA Unit 69010 and Chinese strategic interests in Belt and Road
      Initiative infrastructure and western border security. (Recorded
      Future, 2021)
    targets:
      sectors: [telecommunications, government, mining]
      regions: [Afghanistan, Kazakhstan, Pakistan, Kyrgyzstan, Tajikistan, Uzbekistan]
    sources:
      - url: https://www.recordedfuture.com/research/redfoxtrot-china-pla-targets-bordering-asian-countries
        title: "RedFoxtrot Linked to China's PLA Unit 69010"
        publisher: Recorded Future / Insikt Group

