# ---- Overview ----
description: >
  APT19 (also known as Codoso Team, C0d0so0, and Sunshop Group) is a Chinese cyber
  espionage group active since at least 2010. 

  The group has targeted a wide range of sectors including defense, finance,
  energy, pharmaceutical, telecommunications, high-tech, education, manufacturing, legal
  services, government, think tanks, and political dissidents. 

  APT19 is best known for two high-profile campaigns: the 2014 Forbes.com watering hole attack, in which the group
  chained two zero-day exploits (Adobe Flash CVE-2014-9163 and an IE ASLR bypass) to
  compromise visitors from U.S. defense and financial firms; and a 2017 phishing campaign
  targeting seven global law and investment firms using CVE-2017-0199, macro-enabled Excel
  documents, and Cobalt Strike. 

  The group's earliest known operation was the 2010 compromise
  of the Norwegian Nobel Peace Prize Committee website using a Firefox zero-day, likely
  motivated by the award to Chinese dissident Liu Xiaobo. 

  APT19 relies heavily on Derusbi, a malware family assessed as unique to Chinese espionage operators. The group is connected
  to the "Sunshop Digital Quartermaster" — a suspected common malware development entity
  that FireEye assessed supports as many as 11 separate APT campaigns. APT19's relationship
  to Deep Panda (G0009) is actively debated: Malpedia and some sources treat them as the
  same entity, while MITRE and iSIGHT maintain them as separate (but possibly related)
  groups sharing tools like Derusbi.

  Aliases Notes:

  The aliases and overlapping groups landscape around APT19 remains rather tangled. The core
  question: Are APT19, Deep Panda, Shell Crew, Black Vine, and related designations
  the same group, overlapping groups, or a broader ecosystem?

  MITRE maintains separate entries: APT19 (G0073) and Deep Panda (G0009). MITRE
  explicitly states: "Some analysts track APT19 and Deep Panda as the same group, but
  it is unclear from open source information if the groups are the same." The G0073
  entry references FireEye (2017 law firm phishing), Palo Alto (C0d0so0 attacks), and
  iSIGHT/Dark Reading (Forbes watering hole). The G0009 entry references CrowdStrike
  (think tank targeting), RSA (Shell Crew), ThreatConnect (Anthem breach), and
  Symantec (Black Vine).

  iSIGHT Partners (2015) explicitly stated that while Codoso Team "shares attack
  techniques with Deep Panda, which like Codoso, leans heavily on the use of the
  Derusbi malware," iSIGHT "believes them to be two distinct gangs." The shared use
  of Derusbi may reflect the Sunshop Digital Quartermaster — a suspected common
  malware supplier — rather than organizational identity.

  Malpedia merges all these aliases under a single APT19 entry (including Deep Panda,
  Shell Crew, Black Vine, KungFu Kittens, etc.). The CFR Cyber Operations Tracker
  similarly lists them together.

  * The most recent APT19-specific public reporting is FireEye's June 2017 law firm
  phishing campaign. If Deep Panda is considered the same group, Fortinet reported
  Deep Panda exploiting VMware Horizon servers in 2022. 

