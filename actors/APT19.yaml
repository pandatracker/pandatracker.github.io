# ---- Campaigns ----
campaigns:
- name: Nobel Peace Prize Committee Website Compromise
  year_published: null
  description: >
    APT19/Sunshop Group compromised the website of the Norwegian Nobel Peace Prize
    Committee shortly after the 2010 Nobel Peace Prize was awarded to Liu Xiaobo, a
    Chinese dissident. The attack leveraged a zero-day vulnerability in Mozilla Firefox
    to serve exploits to visitors via a watering hole. iSIGHT's John Hultquist noted
    the connection between the award to a Chinese dissident and the immediate compromise
    of the committee's website. FireEye later linked this attack to the Sunshop Group
    based on shared TTPs including zero-day exploitation and strategic web compromise.
  targets:
    sectors: [political-dissidents, government]
    regions: [Norway]
  sources:
  - url: https://web.archive.org/web/20210615181340/https://www.fireeye.com/blog/threat-research/2013/05/ready-for-summer-the-sunshop-campaign.html
    title: "Ready for Summer: The Sunshop Campaign"
    publisher: FireEye

- name: Sunshop Campaign (IE/Java Zero-Day)
  year_published: null
  description: >
    FireEye identified a campaign exploiting the IE zero-day CVE-2013-1347 (affecting
    IE 8) and Java exploits CVE-2013-2423 and CVE-2013-1493. Attackers compromised
    multiple legitimate websites and inserted malicious JavaScript redirecting visitors
    to an exploit server at sunshop[.]com[.]tw (the infrastructure that gave the group
    its name). Successful exploitation delivered Poison Ivy RAT and Briba backdoor.
    A related U.S. Department of Labor watering hole (noted by CrowdStrike and AlienVault)
    targeted pages with nuclear-related content — likely aimed at Department of Energy
    employees.
  targets:
    sectors: [government, energy, defense]
    regions: [United States]
  sources:
  - url: https://web.archive.org/web/20210615181340/https://www.fireeye.com/blog/threat-research/2013/05/ready-for-summer-the-sunshop-campaign.html
    title: "Ready for Summer: The Sunshop Campaign"
    publisher: FireEye

- name: NGO/Non-Profit Targeting Campaign
  year_published: null
  description: >
    FireEye uncovered a campaign targeting non-profit organizations and non-governmental
    organizations by compromising legitimate websites. Attackers inserted iframes into
    legitimate sites to redirect visitors to attacker-controlled IP addresses serving
    Poison Ivy RAT. FireEye identified the involvement of the Sunshop Digital
    Quartermaster through a shared RT_MANIFEST resource ("Sunshop Manifest") previously
    observed in 86 other samples.
  targets:
    sectors: [non-profit-ngo, political-dissidents]
    regions: [United States]
  sources:
  - url: https://securityaffairs.com/33417/cyber-crime/chinese-hackers-hit-forbes.html
    title: "Chinese hackers hit Forbes visitors with zero-day exploits"
    publisher: Security Affairs (citing FireEye research)

- name: Forbes.com Watering Hole Attack
  year_published: null
  description: >
    APT19/Codoso Team compromised the Forbes.com "Thought of the Day" Flash widget,
    which appeared to every visitor on the site (ranked 61st most popular in the US by
    Alexa). The attack chained two zero-day exploits: an Adobe Flash vulnerability
    (CVE-2014-9163, patched December 9, 2014) and a previously unknown Internet Explorer
    ASLR bypass allowing execution of the Flash exploit. Invincea described the chained
    zero-day technique as "a unicorn" in sophistication, comparing it to Stuxnet. Despite
    the massive reach of Forbes.com, the attack narrowly targeted visitors from U.S.
    defense contractors and financial services firms. Additional websites were found
    targeting Chinese dissident groups with the same exploit, deployed before its public
    disclosure. Derusbi malware variants were delivered as payloads. iSIGHT attributed
    the attack to Codoso Team based on simplified Chinese code, Derusbi (unique to Chinese
    operators), and C2 domain connections to previous Codoso campaigns. Invincea first
    detected the attack through a defense industry customer.
  targets:
    sectors: [defense, finance]
    regions: [United States]
  sources:
  - url: https://www.darkreading.com/cyberattacks-data-breaches/chinese-hacking-group-codoso-team-uses-forbes-com-as-watering-hole
    title: "Chinese Hacking Group Codoso Team Uses Forbes.com As Watering Hole"
    publisher: Dark Reading (citing iSIGHT/Invincea)
  - url: https://web.archive.org/web/20150213004519/http://www.isightpartners.com/2015/02/codoso/
    title: "Cyber Espionage Campaign Compromises Web Properties to Target US Financial Services and Defense Companies, Chinese Dissidents – CVE-2015-0071 and CVE-2014-9163"
    publisher: iSight Partners
  - url: https://web.archive.org/web/20150213004721/http://www.invincea.com/2015/02/chinese-espionage-campaign-compromises-forbes/
    title: "Chinese Espionage Campaign Compromises Forbes.com to Target US Defense, Financial Services Companies in Watering Hole Style Attack"
    publisher: Invincea

- name: C0d0so0 Multi-Industry Campaign
  year_published: null
  description: >
    Palo Alto Networks Unit 42 identified a new wave of attacks by C0d0so0 targeting
    organizations in the telecommunications, high-tech, education, manufacturing, and
    legal services sectors. Two malware variants were deployed: an HTTP-based variant
    disguised as an AVG AntiVirus serial number generator, and a newer variant using
    a custom network protocol over port 22 disguised as a DLL side-loaded by a legitimate
    McAfee application. Both variants shared network communication structure similar to
    Derusbi, with campaign-specific compile times only days before observed attacks. C2
    domains were registered with Chinese addresses and
    resolved to a Hong Kong IP. Notably, several targeted hosts were
    server systems rather than user endpoints, suggesting APT19 was building infrastructure
    for future watering hole attacks. Unit 42 established code lineage to the Forbes.com
    attack through shared single-byte XOR encryption routines and overlapping strings.
  targets:
    sectors: [telecommunications, technology, education, manufacturing, legal-services]
    regions: [United States]
  sources:
  - url: https://unit42.paloaltonetworks.com/new-attacks-linked-to-c0d0s0-group/
    title: "New Attacks Linked to C0d0so0 Group"
    publisher: Palo Alto Networks Unit 42

- name: Law and Investment Firm Phishing Campaign
  year_published: null
  description: >
    FireEye observed a phishing campaign targeting at least seven global law and investment
    firms. APT19 used three different techniques across the campaign, showing rapid
    adaptation. FireEye stated they had "previously observed APT19 steal
    data from law and investment firms for competitive economic purposes." FireEye had
    not observed post-exploitation activity at time of publication.
  targets:
    sectors: [legal-services, finance]
    regions: [United States]
  sources:
  - url: https://cloud.google.com/blog/topics/threat-intelligence/phished-at-the-request-of-counsel/
    title: "Privileges and Credentials: Phished at the Request of Counsel"
    publisher: FireEye

