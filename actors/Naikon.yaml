# ---- Overview ----
description: >
  Naikon is a Chinese state-sponsored cyber espionage group attributed to PLA
  Unit 78020 (Chengdu Military Region Second Technical Reconnaissance Bureau),
  active since at least 2010 and focused on national/international organizations in Southeast Asia and the South China Sea
  region. Its operational mandate aligns with the collection of geopolitical
  intelligence relevant to China's territorial claims and regional influence.

  After being publicly exposed in 2015 — and one operator, Ge Xing
  (GreenSky27), identified by name in ThreatConnect/DGI's CameraShy report —
  Naikon appeared to go silent. However, Check Point Research discovered in
  2020 that the group had maintained continuous operations for five years using
  new backdoor and the tactic of launching attacks from
  previously compromised government infrastructure to exploit inter-agency
  trust. A 2021 Bitdefender report further revealed the group deploying
  backdoors against Southeast Asian military
  organizations.

  Naikon is sometimes conflated with APT30 (MITRE G0013), a separate activity
  cluster first documented by FireEye in April 2015 using a distinct toolset
  (BACKSPACE, NETEAGLE, and air-gap crossing tools). MITRE maintains them as
  separate entries — G0019 for Naikon and G0013 for APT30 — noting they "share
  some characteristics" but "do not appear to be exact matches." 

