affiliation_detail: >
  Attributed by ThreatConnect and Defense Group Inc. to the PLA Chengdu Military Region Second Technical Reconnaissance
  Bureau (Military Unit Cover Designator 78020), headquartered in Kunming,
  Yunnan Province. Attribution published 
  in their September 2015 "Project CameraShy" report,
  identifying PLA officer Ge Xing (葛星, a.k.a. "GreenSky27") as a member of
  Unit 78020 involved in Naikon operations.

  Evidence linking Ge Xing to Unit 78020 included social media profiles
  claiming PLA membership, attendance at PLA International Studies University,
  academic publications under Unit 78020's banner specializing in Southeast
  Asian politics (particularly Thailand), photographs placing Ge Xing at the
  Kunming TRB headquarters compound, and eight pattern-of-life overlaps
  between Ge Xing's activities and greensky27.vicp.net infrastructure over
  five years. All Naikon C2 infrastructure traced back to Kunming.
