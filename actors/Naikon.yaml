# ---- Campaigns ----
campaigns:
- name: South China Sea Espionage Campaign
  year_published: 2015
  description: >
    Kaspersky documented in May 2015 Naikon's long-running espionage
    campaigns targeting government agencies, law enforcement, military,
    and intelligence organizations across Southeast Asia. The group used
    spear-phishing with regionalized lures tied to geopolitical events
    (ASEAN summits, South China Sea disputes) to deliver XsFunction RAT
    and related malware. ThreatConnect/DGI's CameraShy report showed
    the group used regionalized infrastructure with campaign identifiers
    referencing specific targets (UNDP, ASEAN, individual countries).
  targets:
    sectors: [government, military, diplomatic]
    regions: [Philippines, Vietnam, Myanmar, Indonesia, Thailand, Cambodia, Laos, Malaysia, Singapore, Nepal]
  sources:
  - url: https://securelist.com/the-naikon-apt/69953/
    title: "The Naikon APT"
    publisher: Kaspersky Lab
  - url: https://www.threatconnect.com/camerashy
    title: "Project CameraShy"
    publisher: ThreatConnect / DGI

- name: Aria-body Stealth Campaign
  year_published: 2020
  description: >
    Check Point Research discovered in May 2020 that Naikon had maintained continuous operations
    using the Aria-body backdoor. The group targeted government ministries of foreign affairs,
    science and technology, and state-owned companies in SEA. A
    key evasion tactic was using compromised government servers as C2. A malicious
    email from a compromised Indonesian Embassy server was sent to the
    office of the Premier of Western Australia.
  targets:
    sectors: [government, diplomatic, technology]
    regions: [Australia, Indonesia, Philippines, Vietnam, Thailand, Myanmar, Brunei]
  sources:
  - url: https://research.checkpoint.com/2020/naikon-apt-cyber-espionage-reloaded/
    title: "Naikon APT: Cyber Espionage Reloaded"
