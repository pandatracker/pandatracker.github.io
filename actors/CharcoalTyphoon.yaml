# ---- Overview ----
description: >
  Charcoal Typhoon is a Chinese state-linked espionage group active since
  at least 2019 with a "dual mission of intelligence gathering and economic
  espionage" with "persistence, operational intensity, and global reach." (Recorded Future, 2023)
  
  The group targets government institutions, telecommunications,
  academia, media, religious organizations, COVID-19 research, gambling
  companies, and cryptocurrency platforms across 17+ countries. It operates
  under the broader Winnti ecosystem but maintains separate infrastructure, (Trend Micro, 2022)
  and has been directly linked to the Chinese contractor i-Soon. (ESET, 2025)

  The group uses a multi-tiered infrastructure separating reconnaissance
  from long-term C2, and employs both shared Winnti tools and bespoke malware. 
  Recorded Future noted the group's
  "persistence, operational intensity, and global reach" across campaigns
  spanning 17 countries in three years. Some operations appear financially
  motivated, targeting cryptocurrency exchanges and gambling platforms.
  
