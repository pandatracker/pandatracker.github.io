affiliation_detail: >
  Trend Micro (2022) described Charcoal Typhoon/Earth Lusca as a "threat actor originating from China," with IP source region "near Sichuan, Chengdu, China." 

  ESET (2025) identified the group as "FishMonger" and linked it to
  i-Soon, the Chinese contractor whose employees were charged by the DOJ
  in March 2025 for espionage campaigns from 2016 to 2023. The i-Soon
  leak (February 2024) revealed the contractor's role managing offensive
  teams aligned with this group's operations. 

  FBI's wanted list directly associates eight i-Soon employees and two MPS officers to Aquatic Panda. However, the DOJ indictment
  does not specifically list any aliases.

