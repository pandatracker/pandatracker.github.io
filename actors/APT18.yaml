# ---- Overview ----
description: >
  APT18 is a Chinese state-sponsored cyber espionage group attributed by some to the People's
  Liberation Army Navy (PLA Navy), active since at least 2009. 

  The group primarily targets U.S.-based organizations across a wide range of sectors including healthcare, aerospace,
  defense, telecommunications, high technology, and human rights groups. 

  APT18 is best known for the 2014 Community Health Systems breach, in which the personal information of 4.5
  million patients was stolen.

  The group is notable for its rapid exploitation of newly disclosed vulnerabilities,
  particularly demonstrated when it weaponized the HackingTeam-leaked Flash zero-day
  (CVE-2015-5119) within days of disclosure, launching phishing campaigns across numerous
  industry sectors before a patch was available. (FireEye, 2015) 

