# ---- Campaigns ----
campaigns:
- name: Community Health Systems Breach
  year_published: null
  description: >
    APT18 is believed responsible for breaching Community Health Systems (CHS), one of the
    largest hospital operators in the United States. The initial intrusion occurred in April
    2014, with a second intrusion in June 2014. The attackers reportedly exploited the
    OpenSSL Heartbleed vulnerability (CVE-2014-0160) for initial network access. The breach
    resulted in theft of personally identifiable information (SSNs, names, addresses,
    birthdates, phone numbers) for approximately 4.5 million patients.
  targets:
    sectors: [healthcare]
    regions: [United States]
  sources:
  - url: https://threatpost.com/apt-gang-branches-out-to-medical-espionage-in-community-health-breach/107828/
    title: "APT Gang Branches Out to Medical Espionage in Community Health Breach"
    publisher: Threatpost

- name: HackingTeam Flash Zero-Day Exploitation (CVE-2015-5119)
  year_published: null
  description: >
    Following the July 2015 leak of HackingTeam's internal data (which exposed a Flash
    zero-day CVE-2015-5119), APT18 swiftly weaponized the exploit and launched phishing
    campaigns against organizations in numerous sectors before Adobe released a patch on
    July 8, 2015. APT18 sent phishing emails with "Flash Update" themes containing
    malicious URLs that delivered a Flash SWF file exploiting the vulnerability, which
    installed a Gh0st RAT variant communicating with known APT18 C2 infrastructure
    (223.25.233.248). FireEye noted this demonstrated APT18's ability to "shift resources 
    — selecting targets, preparing infrastructure, crafting messages, and updating tools 
    — to take advantage of unexpected opportunities."
  targets:
    sectors: [aerospace, defense, construction, engineering, education, energy, healthcare, biotechnology, technology, 
        non-profit, telecommunications, transportation]
    regions: [United States]
  sources:
  - url: https://cloud.google.com/blog/topics/threat-intelligence/demonstrating-hustle/
    title: "Demonstrating Hustle"
    publisher: FireEye

- name: Pisloader/DNS C2 Campaign
  year_published: null
  description: >
    Palo Alto Networks Unit 42 documented APT18/Wekby targeting a U.S.-based high-tech
    organization with the Pisloader malware, which uses DNS TXT records for command-and-
    control communication. The malware was delivered via HTTP from attacker-controlled
    infrastructure using domains mimicking legitimate companies. 
  targets:
    sectors: [technology]
    regions: [United States]
  sources:
  - url: https://unit42.paloaltonetworks.com/unit42-new-wekby-attacks-use-dns-requests-as-command-and-control-mechanism/
    title: "New Wekby Attacks Use DNS Requests As Command and Control Mechanism"
    publisher: Palo Alto Networks Unit 42

