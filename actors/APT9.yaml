affiliation_detail: >
  Mandiant assesses APT9 as "a freelancer group with some nation-state
  sponsorship, possibly China."

  ASERT's tracking of the group as "Group 27" in the Myanmar
  watering hole campaign is consistent with Chinese state interests
  (Belt and Road monitoring, election intelligence) but does not
  confirm direct government control.

  No DOJ indictment or formal government attribution to a specific buereau or unit has been published.
