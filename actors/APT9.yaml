# ---- Overview ----
description: >
  APT9 is a suspected Chinese cyber espionage group assessed by
  Google TI as a "freelancer group with some nation-state sponsorship."
  The group conducts intellectual property theft, historically with a
  strong focus on the pharmaceuticals and biotechnology industries,
  as well as construction, engineering, aerospace, and defense. (Google TI)

  APT9 is one of the less publicly documented Chinese APT groups.
  Limited information comes from Mandiant's brief public description
  and ASERT/Arbor Networks' "Seven Pointed Dagger" 2015 research on the
  Group 27 cluster, which targeted several Myanmar government websites during
  the 2015 elections using watering hole attacks. 

  In September 2015, Unit 42, in their research on ‘3102’ trojan targeting US and EU entites, noted suspected relationship between the payload observed and
  the payload used in a watering hole attack on Myanmar presidential website in 2015. 
  Furthermote, Unit 42 noted of "ties between the C2 infrastructure and individuals in China active in online hacking forums that claim to work in Trojan development."

