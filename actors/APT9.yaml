# ---- Campaigns ----
campaigns:
- name: Myanmar Election Watering Hole (Seven Pointed Dagger)
  year_published: null
  description: >
    ASERT discovered watering hole attacks on official Myanmar
    government websites, including the Union Election Commission
    (UEC), timed to the November 2015 general elections. The Group 27
    cluster used PlugX malware delivered via compromised election
    information pages. Further investigation uncovered a cluster of
    seven malware families ("Seven Pointed Dagger"): two PlugX
    variants, two Trochilus RAT variants, one 9002 RAT (3102
    variant), one EvilGrab RAT, and one unidentified sample. The
    campaign indicated interest in Myanmar's Special Economic Zones
    and election outcomes. The group continued operating through the
    same compromised websites even after public disclosure by Cisco
    Talos and Arbor Networks.
  targets:
    sectors: [government]
    regions: [Myanmar]
  sources:
  - url: https://www.arbornetworks.com/blog/asert/wp-content/uploads/2016/01/ASERT-Threat-Intelligence-Brief-2015-08-Uncovering-the-Seven-Pointed-Dagger.pdf
    title: "Seven Pointed Dagger"
    publisher: ASERT / Arbor Networks
  - url: https://news.softpedia.com/news/trochilus-rat-evades-antivirus-detection-used-for-cyber-espionage-in-south-east-asia-498776.shtml
    title: "Trochilus RAT Evades Antivirus Detection"
    publisher: Softpedia (reporting on ASERT)

- name: Biotechnology / Pharmaceutical IP Theft
  year_published: null
  description: >
    Mandiant observed APT9 targeting multiple organizations in
    the pharmaceuticals and biotechnology industries. In at least
    one case, the group was simultaneously present in two biotech
    companies and is assessed to have leveraged a trusted business
    relationship between the two firms to pivot from one to the
    other. This is one of the earliest documented examples of the
    trusted-relationship initial access technique in the Chinese
    APT context. Specific timeframes and victim identities have
    not been publicly disclosed.
  targets:
    sectors: [pharmaceuticals, biotechnology]
    regions: [United States]
  sources:
  - url: https://cloud.google.com/security/resources/insights/apt-groups
    title: "APT Groups and Threat Actors"
    publisher: Google Cloud / Mandiant

