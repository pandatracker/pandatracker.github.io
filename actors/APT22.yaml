# ---- Campaigns ----
campaigns:
- name: South Korean Certificate Theft Campaign
  year_published: 2016
  description: >
    APT22/Suckfly systematically compromised South Korean companies in Seoul to steal
    code-signing certificates. Nine certificates were stolen from companies across the
    software (3), gaming (3), entertainment/media (2), and financial services (1)
    sectors. All certificate-owning companies were located in central districts of
    Seoul. The certificates were still valid when discovered in late 2015, and the
    legitimate owners were unaware of the theft. Three certificates were first used
    maliciously in early 2014; the remaining six were likely compromised in 2015.
    Symantec assessed the most likely theft method was malware capable of searching
    for and extracting certificates from within the organizations. The stolen
    certificates were subsequently used to sign all of Suckfly's hacking tools and
    malware, enabling the group's tools to bypass security controls. Symantec noted
    parallels with the Blackfly (Winnti/APT41) group, which also stole certificates
    from South Korean gaming and software companies; Suckfly stole a certificate
    from the same company Blackfly had previously compromised, though the specific
    certificates were different.
  targets:
    sectors: [software, gaming, entertainment, finance]
    regions: [South Korea]
  sources:
  - url: https://www.computerworld.com/article/1660367/cyberespionage-groups-are-stealing-digital-certificates-to-sign-malware-3.html
    title: "Cyberespionage groups are stealing digital certificates to sign malware"
    publisher: Computerworld (citing Symantec)

- name: India-Focused Espionage Campaign
  year_published: 2016
  description: >
    Over a two-year period beginning April 2014, APT22/Suckfly conducted a sustained
    espionage campaign primarily targeting Indian organizations. High-profile targets
    included: one of India's largest financial organizations, a major e-commerce
    company and its primary shipping vendor, one of India's top five IT firms, a US
    healthcare provider's Indian business unit, and two Indian government organizations
    (one linked to central government departments responsible for implementing network
    software across ministries). Government targets had the highest infection rates
    and received more attacker time than most commercial targets — likely because of
    their access to other government systems. The group delivered Backdoor.Nidiran
    through strategic web compromises exploiting CVE-2014-6332 (Windows OLE RCE via
    IE). All malware and hacking tools were signed with certificates stolen from South
    Korean companies. Suckfly operated Monday through Friday, consistent with a
    professional/government-employed team. Suckfly also targeted similar government IT
    organizations in Saudi Arabia. Symantec assessed the targeting pattern suggested
    an intent to disrupt or gain economic insight into India's economy by simultaneously
    targeting financial, e-commerce, shipping, IT, and government sectors.
  targets:
    sectors: [government, finance, e-commerce, information-technology, healthcare]
    regions: [India, Saudi Arabia]
  sources:
  - url: https://securityaffairs.com/47464/intelligence/suckfly-group-target-india.html
    title: "Cyber spies from Suckfly group hacked organizations in India"
    publisher: Security Affairs (citing Symantec)

