last_seen: 2016

# ---- Overview ----
description: >
  APT22 (also known as Suckfly, Barista, and Group 46) is a
  cyber espionage group active since at least early 2014. It is believed to be associated to the Chinese government.

  The group is known for its capability to systematically steal code-signing certificates from South
  Korean companies to digitally sign its malware and hacking tools.

  Symantec's 2016 investigation traced APT22's activity to IP addresses in Chengdu,
  China, and documented the theft of nine code-signing certificates from Seoul-based
  companies across the software, gaming, entertainment, and financial sectors. These
  stolen certificates were used to sign malware,
  allowing the group's tools to appear as legitimate software and bypass security
  controls. 

  APT22's Indian targets included government entities responsible for
  implementing network software across ministries, one of India's largest financial
  organizations, a major e-commerce company and its shipping vendor, and a top-5 IT
  firm. (Symatec, 2016)
  
  FireEye/Mandiant separately tracks APT22 as "Barista" and documents the group's
  use of a broader malware arsenal (PISCES, SOGU/PlugX, FLATNOTE, ANGRYBELL, BASELESS,
  SEAWOLF, LOGJAM) and its targeting of healthcare organizations, particularly
  biomedical and pharmaceutical firms, and cancer research facilities.

