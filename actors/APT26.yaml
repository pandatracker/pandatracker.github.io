# ---- Overview ----
description: >
  APT26 / Turbine Panda is a Chinese state-sponsored cyber espionage
  group, per U.S. DOJ indictment operated by the Jiangsu State Security Department (JSSD), a
  provincial bureau of the Ministry of State Security headquartered in
  Nanjing.

  The group is most notable for its role in the theft of aerospace intellectual property supporting the COMAC C919
  passenger jet development, running from approximately 2010 to 2015.

  Integration between cyber operations and HUMINT was noted by a series of DOJ indicements and CrowdStrike reporting.
  CrowdStrike 2019 report states that the JSSD assigned one officer (Chai Meng) to direct the cyber team and another
  (Xu Yanjun) to recruit ethnic Chinese insiders at target firms. When the hackers could not penetrate a target network remotely,
  insiders were used to deliver malware Sakula (used exclusively in APT26-associated campaigns) via USB drives. 

  MSS officer Xu Yanjun was arrested in Belgium in 2018 and later sentenced to 20 years in prison. In 2024, Xu was sent to China in prisoners swap deal.
  Insiders Zheng Xiaoqing and Ji Chaoqun, were both sentenced, to 24 months and 8 years respectively. (DOJ, 2023; BBC, 2023) 
  Sakula developer Yu Pingan was arrested in 2017 in Los Angeles and charged. (BBC, 2017)

  JSSD was also linked to the 2015 OPM breach
  (22 million personnel records) and the Anthem breach (80 million
  health records) through shared use of the Sakula RAT and overlapping
  infrastructure and TTPs. These connections are CrowdStrike's (2019)
  analytical assessment and have not been confirmed by DOJ indictment.

  APT26 does not have a dedicated MITRE ATT&CK group entry.

