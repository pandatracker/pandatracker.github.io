affiliation_detail: >
  Attributed to the Jiangsu Bureau of the Ministry of State Security
  (JSSD, 江苏省国家安全厅), the provincial MSS office in Nanjing.

  U.S. DOJ indicements did not specifically name APT26. CrowdStrike's October 2019 report synthesized multiple DOJ indictments
  (August 2017 – October 2018) into a single picture, demonstrating that the JSSD coordinated
  both cyber intrusions (Turbine Panda) and traditional recruitment
  of insiders at targeted aerospace firms, under unified bureau direction.

  Two JSSD officers named in the Zhang et al. indictment — Chai Meng
  (cyber operations director) and Liu Chunliang (infrastructure manager)
  — allegedly oversaw the cyber component. JSSD intelligence officer Xu Yanjun, according to the indictment,
  directed recruitment of insiders.
