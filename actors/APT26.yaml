# ---- Campaigns ----
campaigns:
- name: COMAC C919 Supply Chain Espionage
  year_published: null
  description: >
    Systematic targeting of Western aerospace suppliers to the COMAC
    C919 passenger jet. JSSD coordinated cyber intrusions by Turbine
    Panda with HUMINT recruitment of insiders at target firms. Victims
    included GE Aviation, Safran, Honeywell, Ametek, and Capstone
    Turbine. Malware deployed included Sakula, PlugX, and Winnti.
    Insiders planted Sakula via USB when remote access failed. In
    2016, AECC unveiled the CJ-1000AX engine, which closely resembled
    the CFM LEAP-1C/LEAP-X engines produced by the targeted firms.
    CrowdStrike assessed the campaign allowed COMAC to trim "several
    years and potentially billions of dollars" off development time.
  targets:
    sectors: [aerospace, defense, energy]
    regions: [United States, France]
  sources:
  - url: https://web.archive.org/web/20191115162132/https://www.crowdstrike.com/resources/wp-content/brochures/reports/huge-fan-of-your-work-intelligence-report.pdf
    title: "Huge Fan of Your Work: Turbine Panda and the COMAC C919"
    publisher: CrowdStrike

- name: OPM / Anthem Breaches (assessed)
  year_published: null
  description: >
    CrowdStrike assessed that the
    JSSD was behind the 2015 OPM breach (22+ million federal
    personnel records) and the Anthem breach (~80 million health
    records). The assessment is based on: (1) shared Sakula malware
    usage between these breaches and confirmed Turbine Panda
    operations; (2) similar TTPs between the Anthem intrusion and
    a prior Ametek breach attributed to Turbine Panda; (3) IsSpace
    malware used in both the Anthem/OPM intrusions and the C919
    campaign. This attribution has not been confirmed by DOJ
    indictment and remains an analytical assessment. Other vendors
    have used the Deep Panda designation for this activity.
  targets:
    sectors: [government, healthcare]
    regions: [United States]
