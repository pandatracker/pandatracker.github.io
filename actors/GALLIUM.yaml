# ---- Overview ----
description: >
  GALLIUM is a Chinese state-sponsored cyber espionage group that has
  been active since at least 2012, specializing in the compromise of
  telecommunications infrastructure to enable large-scale surveillance.
  The group was first publicly exposed by Cybereason in June 2019 under
  the campaign name "Operation Soft Cell," and subsequently designated
  GALLIUM by Microsoft in December 2019. (Cybereason, 2019; MSTIC, 2019)

  Operation Soft Cell involved multi-year intrusions
  into global telecommunications providers to steal Call Detail Records
  (CDRs) — metadata containing the communications, geolocation, and
  associations of specific high-value individuals. (Cybereason, 2019) At least a dozen global
  telecommunications providers were affected.

  Beginning in 2021, Unit 42 documented an expansion of GALLIUM's
  targeting beyond telecoms to include financial institutions and government
  entities across nine countries, accompanied by the deployment of a new
  RAT called PingPull. (Unit 42, 2022) In 2023, Unit 42 identified a Linux
  variant of PingPull and a previously undocumented backdoor called
  Sword2033, deployed against targets in South Africa. (Unit 42, 2023) 
  In 2024, Unit 42 reported intrusions 
  directed at SEA governments attributed to Alloy Taurus. (Unit 42, 2024)
  
  ESET's 2024 reporting identified GALLIUM activity using SoftEther VPN across African
  telecom operators. (ESET, 2024)

