# ---- Campaigns ----
campaigns:
  - name: Operation Soft Cell
    year_published: 2019
    description: >
      Cybereason exposed a sustained campaign active since at least 2012
      targeting global telecommunications providers. The attackers
      compromised carrier networks to steal Call Detail Records, enabling
      surveillance of specific high-value individuals' communications,
      geolocation, and associations. The group achieved total network
      compromise, exfiltrating "hundreds of gigabytes of call data records"
      each time.
    targets:
      sectors: [telecommunications]
      regions: [Southeast Asia, Europe, Africa]
    sources:
      - url: https://www.cybereason.com/blog/research/operation-soft-cell-a-worldwide-campaign-against-telecommunications-providers
        title: "Operation Soft Cell: A Worldwide Campaign Against Telecommunications Providers"
        publisher: Cybereason Nocturnus

  - name: DeadRinger (Telecom Intrusions Continuation)
    year_published: 2021
    description: >
      Cybereason documented three concurrent clusters of Chinese APT
      activity targeting Southeast Asian telecoms, including continued
      Soft Cell operations through Q1 2021. The group exploited
      Microsoft Exchange ProxyLogon vulnerabilities, deploying PcShare
      backdoor and China Chopper web shells to access CDRs and billing
      systems.
    targets:
      sectors: [telecommunications]
      regions: [Southeast Asia]
    sources:
      - url: https://www.cybereason.com/blog/research/deadringer-exposing-chinese-threat-actors-targeting-major-telcos
        title: "DeadRinger: Exposing Chinese Threat Actors Targeting Major Telcos"
        publisher: Cybereason Nocturnus

  - name: PingPull Multi-Sector Expansion
    year_published: 2022
    description: >
      Unit 42 identified GALLIUM expanding beyond telecoms to target
      financial institutions and government entities across nine countries:
      Afghanistan, Australia, Belgium, Cambodia, Malaysia, Mozambique,
      the Philippines, Russia, and Vietnam. The group deployed a new
      RAT called PingPull using ICMP, HTTPS, and raw TCP for C2
      communications. Over 170 IP addresses were mapped in GALLIUM's
      infrastructure. (Unit 42, 2022)
    targets:
      sectors: [telecommunications, finance, government]
      regions: [Afghanistan, Australia, Belgium, Cambodia, Malaysia, Mozambique, Philippines, Russia, Vietnam]
    sources:
      - url: https://unit42.paloaltonetworks.com/pingpull-gallium/
        title: "GALLIUM Expands Targeting With New PingPull Tool"
        publisher: Palo Alto Networks Unit 42

  - name: South Africa and Linux PingPull Deployment
    year_published: 2023
    description: >
      Unit 42 identified a Linux variant of PingPull and a new backdoor
      called Sword2033 targeting South African entities.
    targets:
      sectors: [government, finance, telecommunications]
      regions: [South Africa, Nepal]
    sources:
      - url: https://unit42.paloaltonetworks.com/alloy-taurus/
        title: "Chinese Alloy Taurus Updates PingPull Malware"
        publisher: Palo Alto Networks Unit 42

  - name: Southeast Asian Government Espionage
    year_published: 2024
    description: >
      Unit 42 attributed with moderate confidence a multiwave intrusion
      campaign against a Southeast Asian government from 2022 through
      2023 to Alloy Taurus. The group exploited Exchange Server
      vulnerabilities, deployed China Chopper web shells, and used
      renamed SoftEther VPN for persistence — a combination unique to
      GALLIUM operations.
    targets:
      sectors: [government]
      regions: [Southeast Asia]
    sources:
      - url: https://unit42.paloaltonetworks.com/alloy-taurus-targets-se-asian-government/
        title: "Persistent Attempts at Cyberespionage Against Southeast Asian Government"
        publisher: Palo Alto Networks Unit 42

