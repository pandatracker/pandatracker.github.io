affiliation_detail: >
  GALLIUM is widely assessed as a Chinese state-sponsored group. Microsoft
  identified the group based on tools and TTPs "commonly associated with
  Chinese threat actors" and noted that its C2 infrastructure was hosted on
  servers in mainland China, Hong Kong SAR, and Taiwan. (MSTIC, 2019)

  Cybereason initially attributed GALLIUM's telecom targeting campaign to activity consistent
  with APT10, though Microsoft subsequently tracked it under the separate
  GALLIUM designation. (Cybereason, 2019; MSTIC, 2019)

  No specific MSS bureau, PLA unit, or contractor has been publicly named.
  No individuals have been indicted. The relationship between GALLIUM and
  APT10 remains ambiguous — Cybereason noted TTPs consistent
  with APT10, while Microsoft tracks GALLIUM as a separate entity.
