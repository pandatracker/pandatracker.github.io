# ---- Overview ----
description: >
  APT20 is a suspected Chinese state-associated cyber espionage group active since at least 2009.

  In its earlier phase (2008-2014), tracked as "th3bug" by Palo Alto, the group favored watering hole attacks using Poison
  Ivy RAT, targeting higher education, healthcare, telecommunications, and Uyghur ethnic
  minority communities. After a period of apparent dormancy (2016-2017), the group re-
  emerged with evolved tradecraft documented by Fox-IT in "Operation Wocao"
  (December 2019), shifting to living-off-the-land techniques, exploiting vulnerable JBoss web servers for initial access,
  deploying web shells, and using legitimate system tools for lateral movement. 

  The group targeted government entities, managed service providers, and organizations across
  aviation, construction, energy, finance, healthcare, insurance, gambling, offshore
  engineering, software development, and transportation in 10+ countries. 

  The "Wocao" name (我操, Chinese slang for "shit" or "damn") originated from a frustrated command the hackers typed when they
  discovered their web shells had been removed by defenders during incident response.

