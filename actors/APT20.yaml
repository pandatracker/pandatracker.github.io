- name: "Operation Wocao"
  year_published: null
  description: >
    Fox-IT discovered operations with medium confidence attributed to APT20 in summer 2018 during incident
    response for a compromised client, ultimately documenting nearly two years of
    activity. The group abandoned custom malware in favor of living-off-the-land techniques. Initial access was primarily through
    exploitation of vulnerable JBoss enterprise application servers. APT20
    leveraged web shells planted by other threat actors on already-compromised servers
    for reconnaissance before deploying their own access. Post-compromise, the group
    used legitimate tools (PowerShell, Mimikatz, ProcDump, PsExec, SMBExec,
    BloodHound/SharpHound, KeeThief, Kerberoast) for lateral movement, credential
    dumping, and Active Directory reconnaissance. A primary objective was VPN credential
    theft for persistent, encrypted access to victim networks. Most significantly,
    Fox-IT documented APT20 bypassing two-factor authentication by stealing RSA SecurID
    software tokens from compromised systems and generating valid one-time codes on
    attacker-controlled computers — effectively defeating 2FA-protected VPN access.
    The investigation identified victims in 10+ countries across government entities,
    managed service providers, and numerous industries. The campaign name originated
    when defenders removed APT20's web shells and the frustrated hackers typed "wocao"
    (我操, Chinese slang for "shit/damn") upon discovering their access was revoked.
  targets:
    sectors: [government, managed-service-providers, aviation, construction-engineering, energy, finance, healthcare, 
        insurance, gambling, offshore-engineering, software-development, transportation]
    regions: [United States, United Kingdom, France, Germany, Italy, Spain, Portugal, Brazil, Mexico]
  sources:
  - url: https://www.fox-it.com/en/news/whitepapers/operation-wocao-shining-a-light-on-one-of-chinas-hidden-hacking-groups/
    title: "Operation Wocao: Shining a light on one of China's hidden hacking groups"
    publisher: Fox-IT (NCC Group)

