# ---- Malware & Tooling ----
campaigns:
- name: TH3Bug Watering Hole Campaigns
  year_published: null
  description: >
    APT20/th3bug conducted a series of watering hole attacks over several years,
    compromising legitimate websites to infect visitors with Poison Ivy RAT variants.
    FireEye's 2013 Poison Ivy report identified th3bug as a distinct campaign active
    since at least 2008. In summer 2014, Palo Alto documented the group compromising a Uyghur-language
    community website and other sites, such as telecom providers or US-based IT
    companies. The malware used Poison Ivy with the
    distinctive password "th3bug." Metasploit Meterpreter shells were used as
    intermediate downloaders. FireEye also noted in
    2013 that th3bug received the IE CVE-2013-3893 exploit (originally used by APT17/
    DeputyDog) shortly after it became publicly available, indicating exploit-sharing
    relationships in the Chinese APT ecosystem.
  targets:
    sectors: [education, healthcare, telecommunications, technology, ethnic-minorities]
    regions: [United States, China]
  sources:
