# ---- Campaigns ----
campaigns:
- name: Satellite and aerospace espionage campaign
  year_published: null
  description: >
    Multi-year cyber espionage campaign targeting U.S. defense contractors and European satellite
    and aerospace companies. Putter Panda used spear-phishing emails, often themed around industry
    conferences and targeting golf-playing attendees, to exploit vulnerabilities in Adobe Reader
    (e.g., CVE-2012-0158) and Microsoft Office. Custom RATs were deployed for long-term access
    and data exfiltration of trade secrets related to satellite, communications, and space technology.
    CrowdStrike documented over 20 confirmed intrusions.
  targets:
    sectors: [defense, aerospace, technology, telecommunications]
    regions: [United States, Europe, Japan]
  sources:
  - url: http://cdn0.vox-cdn.com/assets/4589853/crowdstrike-intelligence-report-putter-panda.original.pdf
    title: "CrowdStrike Intelligence Report: Putter Panda"
    publisher: CrowdStrike

- name: Canadian National Research Council breach (suspected)
  year_published: null
  description: >
    The Canadian government announced in July 2014 that "a highly sophisticated Chinese
    state-sponsored actor" had compromised the National Research Council (NRC) network. CrowdStrike's
    Dmitri Alperovitch stated the attack bore similarities to Putter Panda's past operations against
    aircraft manufacturers. Canada attributed the attack to Chinese state actors but did not publicly
    name Unit 61486. The NRC was forced to rebuild its entire network over approximately one year.
  targets:
    sectors: [government, aerospace]
    regions: [Canada]
  sources:
  - url: https://www.yahoo.com/news/hacking-attack-canada-bears-signs-052307616.html
    title: "Hacking attack in Canada bears signs of Chinese army unit - expert"
    publisher: Reuters

- name: Post-exposure retooling campaign
  year_published: null
  description: >
    After public exposure in June 2014, Putter Panda retooled with new backdoor malware using
    German dynamic DNS providers (spdns.org, spdns.de) for C2. Cylance identified samples targeting
    Russian-language speakers with zero antivirus detection. One Chinese AV vendor briefly detected
    a sample in July 2015 but quickly removed the detection, suggesting possible interference.
  targets:
    sectors: []
    regions: []
  sources:
  - url: https://blogs.blackberry.com/en/2016/01/puttering-into-the-future
    title: "Puttering into the Future…"
    publisher: Cylance (now BlackBerry)

