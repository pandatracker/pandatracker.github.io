# ---- Overview ----
description: >
  APT2, tracked by CrowdStrike as Putter Panda, is a Chinese state-sponsored cyber espionage group
  attributed to PLA Unit 61486, the 12th Bureau of the 3rd General Staff Department, headquartered in
  Shanghai's Zhabei District. 

  Active since at least 2007, the group primarily targeted the U.S. defense industry and European satellite,  aerospace, and
  communications sectors, consistent with the 12th Bureau's mission of space surveillance and satellite SIGINT collection.

  APT2 relied on spear-phishing emails exploiting vulnerabilities in Adobe Reader and Microsoft Office to deploy custom remote access tools. 
  The group notably targeted conference attendees, particularly golf players, leading to its "Putter Panda" codename. 

  CrowdStrike's 2014 report identified shared infrastructure with PLA Unit 61398 (APT1/Comment Panda),  suggesting coordination
  between PLA cyber units. 

  A 2016 Cylance report found the group had retooled with new backdoors achieving zero antivirus detection after its public
  exposure.

