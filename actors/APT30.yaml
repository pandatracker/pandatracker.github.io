# ---- Overview ----
description: >
  APT30 is a Chinese government-suspected cyber espionage group first documented
  by FireEye in April 2015, with tooling development dating back to at least
  2005. 
  
  The group targets government and commercial entities in Southeast Asia
  and India, with a particular focus on ASEAN member states, territorial dispute
  stakeholders, and journalists covering China-related issues. Its intelligence
  collection mission aligns closely with Chinese government interests in the
  SEA region. (FireEye, 2015)

  APT30 is notable for maintaining and developing the BACKSPACE and NETEAGLE backdoors for over a
  decade, and for building air-gap crossing capabilities (SHIPSHAPE,
  SPACESHIP, FLASHFLOOD) into its toolkit from the very beginning of
  development in 2005.
  FireEye's analysis of the BACKSPACE controller GUI (named "NetEagle Remote
  Control System" / 网络神鹰远程控制系统) revealed evidence of shift-work
  operations, target prioritization, and version-controlled malware
  development, suggesting a well-organized professional team. 
  
  PT Security noted in 2024 that the group remains active with modernized versions
  of its classic tools plus new backdoors.

  APT30 is frequently conflated with Naikon (MITRE G0019), a related but
  distinct activity cluster attributed to PLA Unit 78020. MITRE maintains
  them as separate entries — G0013 for APT30 and G0019 for Naikon — noting
  they "share some characteristics" but "do not appear to be exact matches."
 
