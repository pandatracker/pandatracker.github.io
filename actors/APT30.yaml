# ---- Campaigns ----
campaigns:
- name: Decade-Long Southeast Asia / India Espionage (FireEye APT30 Report)
  year_published: null
  description: >
    FireEye documented over a decade of APT30 operations targeting government
    and commercial entities across Southeast Asia and India. The group focused
    on political, economic, and military intelligence, with special emphasis on
    ASEAN-related targets, South China Sea territorial disputes, India-China
    relations, and journalists covering Chinese government issues. Social
    engineering lures were crafted around ASEAN summits (notably January and
    April 2013) and regional security topics. The group used ASEAN-themed
    infrastructure and customized malware, deployed BACKSPACE and NETEAGLE
    backdoors via spear-phishing, and employed SHIPSHAPE/SPACESHIP/FLASHFLOOD
    to cross air-gapped networks. FireEye identified activity at an Indian
    aerospace/defense company and an Indian telecom firm.
  targets:
    sectors: [government, military, diplomatic, defense, aerospace, telecommunications, media]
    regions: [SEA, India]
  sources:
  - url: https://web.archive.org/web/20220512021812/https://www2.fireeye.com/rs/fireye/images/rpt-apt30.pdf
    title: "APT30 and the Mechanics of a Long-Running Cyber Espionage Operation"
    publisher: FireEye

- name: Malaysia / Thailand Targeting (PT Security)
  year_published: null
  description: >
    PT Security detected renewed APT30 activity starting in August 2019 with
    a NETEAGLE dropper disguised as a Malaysian government meeting agenda
    (AGENDA.scr, created by user "Norehan Binti Nordin"). The dropper deployed
    an updated NETEAGLE variant (internal string changed to "JokerPlay") and
    BACKSPACE backdoors with new string encryption algorithms. Samples were
    uploaded from Malaysia to VirusTotal. Additional infrastructure analysis
    revealed two new backdoor families (RHttpCtrl, RCtrl) sharing C2
    infrastructure (gordeneyes.com, kabadefender.com) with the classic tools,
    confirming operational continuity.
  targets:
    sectors: [government]
    regions: [Malaysia]
  sources:
  - url: https://global.ptsecurity.com/en/research/pt-esc-threat-intelligence/eagle-eye-is-back-apt30/
    title: "The eagle eye is back: old and new backdoors from APT30"
    publisher: PT Security

