# ---- Overview ----
description: >
  Lotus Blossom is a suspected Chinese state-aligned espionage group active since
  at least 2009, targeting government, military, diplomatic, telecom, and
  critical infrastructure organizations primarily in Southeast Asia. The
  group is defined by patient, long-dwell-time intelligence collection
  and a distinctive custom malware. (SOCRadar, 2026)
  
  In 2015, Palo Alto's Unit 42 attributed a targeted attack directed at an French diplomat based in Taipei 
  to Lotus Blossom, noting likely interest in "gaining insights into relations between France and Taiwan."

  The group progressed from spear-phishing with weaponized Office
  documents to living-off-the-land techniques and
  supply chain attacks. (SOCRadar, 2026) In 2022, Symantec documented Lotus Blossom
  (as Billbug) targeting a national Certificate Authority alongside
  government agencies in multiple Asian countries. 
  
  In 2025, the group executed a supply chain compromise of Notepad++ update infrastructure
  to deliver the Chrysalis backdoor to selectively
  targeted in Southeast Asia across government, telecommunications and critical infrastructure sectors
  over six months. (Rapid7, 2026; Palo Alto Unit 42, 2026)

