# ---- Overview ----
description: >
  APT17 is linked by Intrusion Truth to the Ministry of State Security's Jinan bureau (Shandong Province).

  APT17 is characterized by prolific use of zero-day exploits (particularly Internet Explorer vulnerabilities), strategic
  web compromises (watering holes), and supply chain attacks. The group gained its "DeputyDog"
  name from FireEye's 2013 discovery of a campaign using IE zero-days against Japanese targets.
  Subsequent FireEye research documented Operation Ephemeral Hydra (2013) and Operation SnowMan
  (2014), both sharing infrastructure and tradecraft with DeputyDog. 

  APT17 was, among other campaigns, described to be involved in the 2009 Operation Aurora. The group is also linked to the 2017 CCleaner supply chain compromise, which affected 2.27
  million users and deployed the ShadowPad backdoor to a targeted subset. Most recently, in 2024, APT17 was observed targeting Italian companies and government entities with the
  9002 RAT. 

  Intrusion Truth reported that in 2015, during Xi Jinping's crackdown on Chinese
  hackers, a Jinan office associated with APT17 activity was raided by the local Public
  Security Bureau, resulting in several arrests. Intrusion Truth noted these arrests may
  have been used to co-opt hackers into MSS service, as APT17 activity continued.

