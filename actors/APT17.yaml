# ---- Campaigns ----
campaigns:
- name: Operation Aurora
  year_published: null
  description: >
    Cyber espionage campaign targeting Google, Adobe, Juniper Networks, and 30+
    other major companies. Attackers used a zero-day in Internet Explorer (CVE-2010-0249)
    to deliver the Hydraq/9002 RAT. Google disclosed the attack publicly in January 2010,
    stating attackers sought access to Gmail accounts of Chinese human rights activists and
    stole intellectual property including source code. The attack fundamentally changed
    public awareness of state-sponsored cyber espionage. Symantec attributed the attack to
    the "Elderwood" group (named after a source-code variable), which has been linked to
    APT17. McAfee named the campaign "Aurora" after a folder name found in the malware.
  targets:
    sectors: [technology, defense, financial, manufacturing, aerospace, energy]
    regions: [United States, global]
  sources:
  - url: https://en.wikipedia.org/wiki/Operation_Aurora
    title: "Operation Aurora"
    publisher: Wikipedia (aggregating Google, McAfee, Symantec, CrowdStrike reporting)

- name: Bit9 Breach
  year_published: null
  description: >
    Attackers compromised application whitelisting security firm Bit9, deploying HiKit
    rootkit variants and stealing digital code-signing certificates. The stolen certificates
    were subsequently used to sign malware in later campaigns, including the VOHO campaign.
    FireEye linked the Bit9 C2 infrastructure to Operation DeputyDog via shared domain
    registrations and IP addresses.
  targets:
    sectors: [technology]
    regions: [United States]
  sources:
  - url: https://www.fireeye.com/blog/threat-research/2013/09/operation-deputydog-zero-day-cve-2013-3893-attack-against-japanese-targets.html
    title: "Operation DeputyDog"
    publisher: FireEye

- name: Operation DeputyDog
  year_published: null
  description: >
    FireEye discovered a campaign using IE zero-day CVE-2013-3893 against Japanese
    organizations. Malware samples contained the builder string "DGGYDSYRL" — the basis
    for the "DeputyDog" name. Payloads were XOR-encoded (key 0x95) and disguised as image
    files. FireEye linked the C2 infrastructure to the Bit9 breach via shared domains
    (yahooeast.net, blankchair.com) and IP addresses. Most samples were compiled on
    2013-08-19 within one second of each other.
  targets:
    sectors: [government, technology]
    regions: [Japan]
  sources:
  - url: https://www.fireeye.com/blog/threat-research/2013/09/operation-deputydog-zero-day-cve-2013-3893-attack-against-japanese-targets.html
    title: "Operation DeputyDog: Zero-Day Attack Against Japanese Targets"
    publisher: FireEye

- name: Operation Ephemeral Hydra
  year_published: null
  description: >
    FireEye discovered a new IE zero-day (CVE-2013-3918) deployed via strategic web
    compromise of a site "likely to draw visitors interested in national and international
    security policy." The attack was notable for loading its payload (9002 RAT variant)
    directly into memory without writing to disk — a technique not typically used by APT
    actors at the time. Infrastructure overlap with DeputyDog confirmed via the shared
    domain dll.freshdns.org.
  targets:
    sectors: [government, defense, think-tanks]
    regions: [United States]
  sources:
  - url: https://www.fireeye.com/blog/threat-research/2013/11/operation-ephemeral-hydra-ie-zero-day-linked-to-deputydog-uses-diskless-method.html
    title: "Operation Ephemeral Hydra"
    publisher: FireEye

- name: Operation SnowMan
  year_published: null
  description: >
    FireEye identified IE 10 zero-day CVE-2014-0322 served from the U.S. Veterans of
    Foreign Wars (VFW.org) website as a watering hole targeting U.S. military personnel.
    The attack was timed during a paralyzing snowstorm at the U.S. Capitol ahead of
    Presidents' Day weekend. A Flash object orchestrated exploitation, dropping a ZxShell
    backdoor via the same 0x95 XOR/.jpg extension technique used in DeputyDog. Websense
    also identified targeting of GIFAS (French aerospace association). Infrastructure and
    tradecraft links confirmed connection to DeputyDog and Ephemeral Hydra campaigns.
  targets:
    sectors: [military, defense, aerospace]
    regions: [United States, France]
  sources:
  - url: https://www.fireeye.com/blog/threat-research/2014/02/operation-snowman-deputydog-actor-compromises-us-veterans-of-foreign-wars-website.html
    title: "Operation SnowMan"
    publisher: FireEye

- name: Operation SMN (Industry Coalition vs. Axiom)
  year_published: null
  description: >
    Coordinated industry coalition led by Novetta (with Symantec, Cisco, FireEye, F-Secure,
    iSIGHT Partners, Microsoft, ThreatConnect, Tenable, ThreatTrack Security, Volexity)
    targeting the Axiom group's malware infrastructure. The coalition shared intelligence
    and resources to create comprehensive, multi-vendor detection for Hikit, ZxShell,
    Derusbi, Winnti, and other Axiom tools. This was one of the first major cross-industry
    coordinated responses to a state-sponsored APT group.
  targets:
    sectors: [not-applicable]
    regions: [not-applicable]
  sources:
  - url: https://www.novetta.com/wp-content/uploads/2014/11/Executive_Summary-Final_1.pdf
    title: "Operation SMN: Axiom Threat Actor Group Report"
    publisher: Novetta

- name: BLACKCOFFEE/TechNet Dead Drop Resolver
  year_published: null
  description: >
    FireEye and Microsoft jointly exposed APT17's technique of creating bogus profiles on
    Microsoft TechNet and embedding encoded C2 IP addresses in profile pages and forum
    posts for BLACKCOFFEE malware variants. The group created biographical sections and
    posted in legitimate threads to make profiles appear authentic. This "dead drop resolver"
    technique made it difficult for defenders to identify true C2 locations and allowed
    infrastructure to remain active longer. Microsoft released anti-malware signatures;
    FireEye released IOCs.
  targets:
    sectors: [government, technology, law-firms, defense, mining, NGOs]
    regions: [United States]
  sources:
  - url: https://www.fireeye.com/blog/threat-research/2015/05/hiding_in_plain_sigh.html
    title: "Hiding in Plain Sight"
    publisher: FireEye / Microsoft

- name: CCleaner Supply Chain Compromise
  year_published: null
  description: >
    Attackers compromised Piriform's network (CCleaner developer, acquired by Avast July
    2017) and injected a backdoor into CCleaner version 5.33.6162, affecting approximately
    2.27 million users who downloaded the compromised update. Kaspersky's Costin Raiu first
    identified code overlap between the CCleaner backdoor and Axiom/APT17 tools. Intezer
    confirmed shared code with earlier APT17 samples. Avast's investigation found ShadowPad
    backdoor installed on four Piriform computers (April 2017), with custom-built keylogger
    capabilities. The second-stage payload was deployed to only ~40 machines, targeting
    major tech companies. Attackers initially entered Piriform's network via TeamViewer.
    In 2019, Avast detected and thwarted a second supply chain attack attempt against
    CCleaner, again attributed to Axiom/APT17.
  targets:
    sectors: [technology]
    regions: [global]
  sources:
  - url: https://www.darkreading.com/data-privacy/chinese-apt-backdoor-found-in-ccleaner-supply-chain-attack
    title: "Chinese APT Backdoor Found in CCleaner Supply Chain Attack"
    publisher: Dark Reading
  - url: https://intezer.com/blog/evidence-aurora-operation-still-active-supply-chain-attack-through-ccleaner/
    title: "Evidence Aurora Operation Still Active: Supply Chain Attack Through CCleaner"
    publisher: Intezer

- name: Italian Government and Companies (9002 RAT)
  year_published: null
  description: >
    Italian cybersecurity firm TG Soft documented APT17 targeting Italian companies and
    government entities in two waves. The first campaign (June 24) used a malicious Office
    document; the second (July 2) used a link. Both invited victims to install a fake
    Skype for Business package from a domain mimicking the Italian government, delivering
    a variant of the 9002 RAT. The RAT was deployed via an MSI installer that triggered
    a JAR file through VBScript, which decrypted and executed shellcode launching 9002 RAT.
    The malware included diskless variants and modular architecture to reduce detection.
  targets:
    sectors: [government, technology]
    regions: [Italy]
  sources:
  - url: https://thehackernews.com/2024/07/china-linked-apt17-targets-italian.html
    title: "China-linked APT17 Targets Italian Companies with 9002 RAT Malware"
    publisher: The Hacker News / TG Soft

