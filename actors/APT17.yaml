affiliation_detail: >
  Intrusion Truth published a series of articles in July 2019 identifying APT17 as being
  managed by the Jinan bureau of the Chinese Ministry of State Security (MSS). They identified four individuals:
  (1) Guo Lin (郭林), assessed to be an MSS officer who is affiliated with four private technology companies in Jinan,
  (2) Wang Qingwei (王庆卫), (3) Zeng Xiaoyong (曾小勇, aka "envymask") and (4) Zhang Peng (aka "missll").
  All identified individuals operated from Jinan, the capital of Shandong Province.

  Intrusion Truth further documented links between APT17 operators and APT41, noting
  shared malware (BLACKCOFFEE) and personal connections between individuals, suggesting
  an "interlinked network of Chinese cyber actors sharing malware, expertise and connections."

  No DOJ indictment has been filed against APT17 operators as of the profile date.
