# ---- Overview ----
description: >
  Tropic Trooper is a suspected Chinese state-sponsored cyber espionage group active
  since at least 2011, targeting primarily government, military, healthcare,
  transportation, and technology organizations in Taiwan, the Philippines,
  and Hong Kong. (Trend Micro, 2015; MITRE, n.d.)

  The group first gained public attention through Trend Micro's 2015
  "Operation Tropic Trooper" report, which documented campaigns against
  Taiwanese government institutions and Philippine military targets using
  weaponized document exploits. The "KeyBoy" alias derives from early
  malware samples used to target the Tibetan community and parliamentary
  staff. (Citizen Lab, 2016)

  Tropic Trooper is notable for its capability to penetrate air-gapped
  military networks. In 2020, Trend Micro documented USBferry, a USB
  malware active since at least December 2014 that targets physically
  isolated environments in the Taiwanese and Philippine military. The
  group was observed pivoting from a military hospital into air-gapped
  networks to exfiltrate defense-, ocean-, and ship-related documents.
  (Trend Micro, 2020) In 2021, Trend Micro identified the group expanding
  into the transportation sector, accessing flight schedules and financial
  data from compromised hosts. (Trend Micro, 2021)

  In 2024, Kaspersky documented the group targeting a Middle Eastern government entity involved in human
  rights studies — "particularly those related to the Israel-Hamas war" —
  since at least June 2023. (Kaspersky, 2024) 
  
  In April 2026, Zscaler ThreatLabz and Itochu researchers identified campaigns using trojanized
  SumatraPDF with military-themed lures and AdaptixC2 beacons leveraging
  GitHub for C2, targeting individuals in Japan, Taiwan, and South Korea.
  (Zscaler, 2026; Dark Reading, 2026)

