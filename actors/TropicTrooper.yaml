affiliation_detail: >
  Tropic Trooper is assessed as a Chinese state-sponsored group based on
  its sustained targeting of Taiwan, the Philippines, and Hong Kong —
  regions of direct strategic interest to the PRC — as well as its use
  of tools and TTPs common to the Chinese APT ecosystem (China Chopper,
  Poison Ivy, TClient). (Trend Micro, 2015; Kaspersky, 2024) No specific
  MSS bureau, PLA unit, or contractor has been publicly identified.

  Kaspersky noted potential connections between Tropic Trooper and the
  FamousSparrow threat group. (Kaspersky, 2024)

