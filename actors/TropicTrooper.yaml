# ---- Campaigns ----
campaigns:
  - name: Operation Tropic Trooper
    year_published: 2015
    description: >
      Trend Micro documented the group's initial campaigns targeting
      Taiwanese government institutions and Philippine military entities
      using spear-phishing with weaponized document exploits. The
      campaign name became the group's primary designation. (Trend Micro,
      2015)
    targets:
      sectors: [government, military]
      regions: [Taiwan, Philippines]
    sources:
      - url: https://documents.trendmicro.com/assets/wp/wp-operation-tropic-trooper.pdf
        title: "Operation Tropic Trooper"
        publisher: Trend Micro

  - name: USBferry Air-Gapped Network Targeting
    year_published: 2020
    description: >
      Trend Micro documented USBferry, a USB malware active since
      December 2014, targeting physically isolated military networks
      in Taiwan and the Philippines. The group pivoted from military
      hospitals into air-gapped environments and exfiltrated defense,
      naval, and shipping documents. Three USBferry versions were
      identified, with the latest residing entirely in memory. Targets
      included military/navy agencies, government institutions, and a
      national bank. (Trend Micro, 2020)
    targets:
      sectors: [military, government, healthcare]
      regions: [Taiwan, Philippines]
    sources:
      - url: https://www.trendmicro.com/en_us/research/20/e/tropic-troopers-back-usbferry-attack-targets-air-gapped-environments.html
        title: "Tropic Trooper's Back: USBferry Attack Targets Air-gapped Environments"
        publisher: Trend Micro

  - name: Earth Centaur Transportation Sector Campaign
    year_published: 2021
    description: >
      Trend Micro documented Tropic Trooper expanding to target the
      transportation sector in Taiwan, the Philippines, and Hong Kong.
      The group accessed flight schedules, financial plans, and personal
      information from compromised hosts. Backdoors used reverse proxy
      protocols to bypass network security monitoring. (Trend Micro, 2021)
    targets:
      sectors: [transportation, government, healthcare]
      regions: [Taiwan, Philippines, Hong Kong]
    sources:
      - url: https://www.trendmicro.com/en_us/research/21/l/collecting-in-the-dark-tropic-trooper-targets-transportation-and-government-organizations.html
        title: "Earth Centaur Targets Transportation and Government"
        publisher: Trend Micro

  - name: Middle East Government Targeting (Human Rights)
    year_published: 2024
    description: >
      Kaspersky documented a year-long campaign (June 2023–2024) targeting
      a Middle Eastern government entity involved in human rights studies,
      "particularly those related to the Israel-Hamas war." The group
      deployed a China Chopper web shell variant embedded in Umbraco CMS,
      the Crowdoor loader (related to SparrowDoor), and DLL side-loading
      implants. A Malaysian government entity was simultaneously targeted.
      Kaspersky attributed with high confidence and noted this represented
      "a new strategic move" for the group. (Kaspersky, 2024)
    targets:
      sectors: [government, political-dissidents]
      regions: [Middle East, Malaysia]
    sources:
      - url: https://securelist.com/new-tropic-trooper-web-shell-infection/113737/
        title: "New Malicious Web Shell from the Tropic Trooper Group"
        publisher: Kaspersky GReAT

  - name: Trojanized SumatraPDF / AdaptixC2 Campaign
    year_published: 2026
    description: >
      Zscaler ThreatLabz identified Tropic Trooper distributing
      trojanized SumatraPDF installers bundled with military-themed
      decoy documents to target Chinese-speaking individuals in Taiwan
      and individuals in South Korea and Japan. The group used GitHub
      as a C2 platform for custom AdaptixC2 Beacons. Itochu researchers
      additionally discovered an exposed S3 bucket containing 48 files
      with new malware and phishing pages mimicking Signal authentication.
      (Zscaler, 2026; Itochu via Dark Reading, 2026)
    targets:
      sectors: [government, military]
      regions: [Taiwan, Japan, South Korea]
    sources:
      - url: https://www.zscaler.com/blogs/security-research/tropic-trooper-pivots-adaptixc2-and-custom-beacon-listener
        title: "Tropic Trooper Uses Trojanized SumatraPDF and GitHub to Deploy AdaptixC2"
        publisher: Zscaler ThreatLabz
      - url: https://www.darkreading.com/threat-intelligence/tropic-trooper-apt-takes-aim-home-routers-japanese-targets
        title: "Tropic Trooper APT Takes Aim at Home Routers, Japanese Targets"
        publisher: Dark Reading (reporting on Itochu Cyber & Intelligence)

