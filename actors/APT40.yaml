# ---- Campaigns ----
campaigns:
- name: Naval Modernization and Maritime Espionage (TEMP.Periscope)
  year_published: null
  description: >
    FireEye documented APT40's campaign targeting maritime
    technology, naval research, engineering, and transportation sectors
    in support of China's naval modernization and blue-water navy
    ambitions. Targets included universities engaged in naval research,
    defense contractors, and organizations involved in submersible and
    autonomous vehicle development. The group masqueraded as an
    underwater vehicle manufacturer after China's PLAN seized a U.S.
    Navy UUV in the South China Sea in December 2016. Operations
    expanded to Belt and Road Initiative-related targeting across
    Cambodia, Belgium, Germany, the Philippines, Malaysia, Norway,
    Saudi Arabia, Switzerland, the U.S., and UK.
  targets:
    sectors: [maritime, defense, aerospace, engineering, transportation, academia]
    regions: [United States, Cambodia, Belgium, Germany, Philippines, Malaysia, Norway, Saudi Arabia, Switzerland, 
        United Kingdom]
  sources:
  - url: https://cloud.google.com/blog/topics/threat-intelligence/apt40-examining-a-china-nexus-espionage-actor/
    title: "APT40: Examining a China-Nexus Espionage Actor"
    publisher: FireEye / Mandiant

- name: Biomedical and IP Theft Campaign (DOJ Indictment)
  year_published: null
  description: >
    The DOJ indictment detailed APT40's theft of trade secrets and
    intellectual property from entities in 12 countries. Targeted
    information included data on submersibles, autonomous vehicles,
    chemical formulas, commercial aircraft servicing, genetic-sequencing
    technology, and infectious-disease research (Ebola, MERS, HIV/AIDS,
    Marburg, tularemia).
  targets:
    sectors: [biomedical, healthcare, defense, academia, aerospace, manufacturing, transportation]
    regions: [United States, Austria, Cambodia, Canada, Germany, Indonesia, Malaysia, Norway, Saudi Arabia, South Africa,
      Switzerland, United Kingdom]
  sources:
  - url: https://www.justice.gov/opa/pr/four-chinese-nationals-working-ministry-state-security-charged-global-computer-intrusion
    title: "DOJ Indictment — APT40"
    publisher: U.S. Department of Justice

- name: New Zealand Parliamentary Breach
  year_published: null
  description: >
    New Zealand's GCSB/NCSC attributed a 2021 breach of the Parliamentary
    Counsel Office and Parliamentary Service to APT40. The compromise was
    detected relatively quickly and contained before strategic or sensitive
    data was exfiltrated. The attribution was disclosed publicly in March
    2024 as part of a coordinated international action alongside the
    U.S./UK APT31 announcements.
  targets:
    sectors: [government]
    regions: [New Zealand]
  sources:
  - url: https://www.beehive.govt.nz/release/parliamentary-network-breached-prc
    title: "Parliamentary Network Breached by the PRC"
    publisher: New Zealand Government

- name: Australian Network Intrusions (ASD Case Studies)
  year_published: null
  description: >
    The 2024 multinational advisory documented two ASD-investigated
    breaches of Australian organizations in 2022. In the first case
    (July-September 2022), APT40 exploited a custom web application to
    establish a foothold in a network DMZ, then used compromised
    credentials for Active Directory enumeration and SMB-based data
    exfiltration. In the second case (April-May 2022), APT40 exploited
    RCE vulnerabilities in a remote access login portal, deploying
    web shells and capturing hundreds of username-password pairs, MFA
    codes, and JSON Web Tokens.
  targets:
    sectors: [government, technology]
    regions: [Australia]
  sources:
