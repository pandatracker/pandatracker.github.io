# ---- Overview ----
description: >
  According to U.S. DOJ indictment (2021) and Intrusion Truth (2020) investigation series, APT40 is a Chinese state-sponsored cyber espionage group attributed to
  the Ministry of State Security's Hainan State Security Department (HSSD),
  operating from Haikou, Hainan Province since at least 2009. 

  The group conducted operations through the front company Hainan Xiandun Technology
  Development Company (海南仙盾). APT40's primary mission is the theft
  of intellectual property, and government intelligence in
  support of China's naval modernization, the Belt and Road Initiative, or high-tech R&D. (U.S. DOJ, 2021; FireEye, 2019)

  According to the DOJ indictment, APT40 has targeted academia, aerospace, biomedical research, defense,
  government, healthcare, manufacturing, maritime technology, and
  transportation in 14 countries. Stolen information has included data on submersibles,
  autonomous vehicles, chemical formulas, commercial aircraft servicing,
  genetic-sequencing technology, and infectious-disease research. 

  According to a 2024 CISA advisory, APT40 "possesses the capability to rapidly transform and adapt exploit proof-of-concept(s) (POCs) 
  of new vulnerabilities and immediately utilize them against target networks",
  often "within hours or days of public release."

