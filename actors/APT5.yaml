last_seen: 2024

# ---- Overview ----
description: >
  APT5 is a China-based cyber espionage actor active since at least 2007,
  primarily targeting the telecommunications, aerospace, and defense
  industries across the United States, Europe, and Asia. Mandiant
  characterizes it as "a large threat group that consists of several
  subgroups, often with distinct tactics and infrastructure." (Mandiant,
  n.d.)

  The group is distinguished by its focus on compromising
  network infrastructure devices — VPN appliances, routers, application
  delivery controllers — and modifying their underlying software to
  maintain persistent access while bypassing authentication controls.
  As early as 2014, Mandiant observed APT5 making unauthorized code
  modifications to files in embedded operating systems of technology
  platforms. In 2015, APT5 compromised a U.S. telecommunications
  organization and "downloaded and modified some of the router images
  related to the company's network routers." (Mandiant, n.d.)

  In April 2021, Mandiant documented APT5 (tracked as UNC2630) exploiting
  a zero-day in Pulse Secure VPN appliances to target
  U.S. defense industrial base networks. The group deployed 16 distinct
  malware families specifically designed for Pulse Secure devices. CISA issued an
  emergency directive requiring all federal agencies to assess their Pulse
  Secure deployments. (Mandiant, 2021; CISA, 2021)

  In December 2022, the NSA published a named advisory attributing active
  exploitation of a Citrix ADC zero-day to APT5. The
  vulnerability allowed unauthenticated remote code execution on Citrix
  Application Delivery Controller and Gateway devices. (NSA, 2022) APT5 has also
  been documented using ORB (Operational Relay Box) networks — specifically
  the SPACEHOP infrastructure — for network reconnaissance and exploit
  delivery, raising the cost of attribution for defenders. (Mandiant, 2024)

