# ---- Campaigns ----
campaigns:
  - name: Pulse Secure VPN Zero-Day Exploitation (UNC2630)
    year_published: 2021
    description: >
      Mandiant documented UNC2630 (assessed as APT5) exploiting a
      zero-day vulnerability (CVE-2021-22893) in Pulse Secure VPN
      appliances to target U.S. defense industrial base networks
      beginning August 2020. The group deployed 16 malware families
      designed specifically for Pulse Secure, including SLOWPULSE
      (which bypasses LDAP and RADIUS 2FA), ATRIUM, PACEMAKER, and
      RADIALPULSE. CISA issued Emergency Directive 21-03 requiring
      all federal agencies to assess their Pulse Secure environments.
      Mandiant noted "these actors display an unusual sensitivity to
      publicity" after observing UNC2630 rapidly remove backdoors from
      dozens of devices around the time of public disclosure. (Mandiant,
      2021)
    targets:
      sectors: [defense, government, finance, technology]
      regions: [United States, Europe]
    sources:
      - url: https://cloud.google.com/blog/topics/threat-intelligence/suspected-apt-actors-leverage-bypass-techniques-pulse-secure-zero-day
        title: "Check Your Pulse"
        publisher: Mandiant / FireEye
      - url: https://cloud.google.com/blog/topics/threat-intelligence/updates-on-chinese-apt-compromising-pulse-secure-vpn-devices
        title: "Re-Checking Your Pulse"
        publisher: Mandiant

  - name: Citrix ADC Zero-Day Exploitation (CVE-2022-27518)
    year_published: 2022
    description: >
      The NSA published a named advisory attributing active exploitation
      of a critical Citrix ADC zero-day (CVE-2022-27518, CVSS 9.8) to
      APT5. The vulnerability allowed unauthenticated remote code
      execution on Citrix Application Delivery Controller and Gateway
      devices configured with SAML SP or IdP. APT5 modified legitimate
      binaries for persistence, requiring investigation beyond patching.
      CISA added the CVE to the KEV catalog on December 13, 2022.
      (NSA, 2022; Citrix, 2022)
    targets:
      sectors: [telecommunications, technology, defense]
      regions: [United States, global]
    sources:
      - url: https://media.defense.gov/2022/Dec/13/2003131586/-1/-1/0/CSA-APT5-CITRIXADC-V1.PDF
        title: "APT5: Citrix ADC Threat Hunting Guidance"
        publisher: National Security Agency (NSA)

  - name: Telecom and Router Infrastructure Compromise (2014–2015)
    year_published: null
    description: >
      Mandiant documented APT5 making unauthorized code modifications
      to files in the embedded operating system of a technology platform
      as early as 2014. In 2015, APT5 compromised a U.S. telecommunications
      organization and downloaded and modified router images. During the
      same period, APT5 stole military technology files from a South Asian
      defense organization, including product specifications, procurement
      bids, and documents on unmanned aerial vehicles (UAVs). (Mandiant,
      n.d.)
    targets:
      sectors: [telecommunications, defense, technology]
      regions: [United States, South Asia]
    sources:
      - url: https://cloud.google.com/security/resources/insights/apt-groups
        title: "APT Groups — APT5"
        publisher: Mandiant / Google Cloud

