# ---- Overview ----
description: >
  According to the U.S. DOJ indictment, HAFNIUM/Silk Typhoon is a Chinese state-sponsored cyber espionage group directed 
  by the MSS's Shanghai State Security Bureau (SSSB). 
  
  The group was first described in
  March 2021 when Microsoft attributed the exploitation of four
  zero-day vulnerabilities in Microsoft Exchange Server. The campaign, 
  intially utilizing stolen credential or Microsoft Exchange Server zero day vulnerabilities, deployed
  web shells for persistent access to emails and sensitive data
  from government agencies, defense contractors, law firms, universities,
  and infectious disease researchers. (Microsoft, 2021)

  During the COVID-19 pandemic, HAFNIUM targeted American
  universities conducting vaccine research, attempting to steal COVID-19 research data. (U.S. DOJ, 2021)
  More recently, the group targeted IT supply chain:
  Microsoft's March 2025 report documented Silk Typhoon compromising IT
  services providers, remote monitoring and management companies,
  and managed service providers to reach downstream customer
  environments. (Microsoft, 2025)

  In July 2025, the DOJ unsealed indictments against two HAFNIUM
  operators — Xu Zewei and Zhang Yu — employed by Shanghai Powerock
  and Shanghai Firetech respectively. Xu was arrested on July 3, 2025, at Milan's Malpensa Airport by
  Italian law enforcement acting on a U.S. warrant. He was extradicted to the USA in April 2026. Zhang Yu remains at large.

  SentinelLabs research (2025) revealed that Shanghai Firetech
  registered over 10 patents for intrusive data collection technologies,
  including remote automated evidence collection software, Apple computer
  forensics, router evidence collection, hard drive decryption, and
  remote cellphone evidence collection.

