campaigns:
- name: COVID-19 Vaccine Research Espionage
  year_published: 2025
  description: >
    Beginning in February 2020 as the pandemic emerged, HAFNIUM
    operators targeted American universities conducting COVID-19
    vaccine research. The U.S. DOJ indictment
    stated this campaign was aimed at "stealing groundbreaking
    COVID-19 research" on behalf of the CCP.
  targets:
    sectors: [higher-education, infectious-disease-research, healthcare]
    regions: [United States]
  sources:
  - url: https://www.justice.gov/usao-sdtx/pr/chinese-state-sponsored-hacker-arrested-us-warrant
    title: "DOJ Indictment — Xu Zewei and Zhang Yu"
    publisher: U.S. Department of Justice

- name: Microsoft Exchange Server Mass Exploitation
  year_published: 2021
  description: >
    HAFNIUM's most notorious campaign. The group initially gained
    stealthy access to U.S. government and organizational emails
    through zero-day exploitation of four Exchange Server
    vulnerabilities (ProxyLogon chain) starting in late 2020.
    Microsoft disclosed and patched the vulnerabilities on March 2,
    2021. Between Microsoft's alert to partners (February 23) and
    public disclosure, other Chinese groups began mass exploitation
    at scale (February 28). The FBI assessed the campaign targeted
    over 60,000 U.S. entities and successfully compromised more than
    12,700. Web shells deployed during exploitation provided
    persistent access even after patches were applied.

    On July 19, 2021, the U.S., EU, UK, NATO, and allied nations
    issued a coordinated attribution with high confidence to PRC
    MSS-affiliated actors.
  targets:
    sectors: [government, defense, legal, higher-education, healthcare, NGOs, policy-think-tanks]
    regions: [United States, global]
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
    title: "HAFNIUM Targeting Exchange Servers with 0-day Exploits"
    publisher: Microsoft

- name: Telecom and ISP Targeting (Tarrask)
  year_published: 2022
  description: >
    HAFNIUM deployed the Tarrask defense evasion malware against
    telecommunications companies, ISPs, and data service companies.
    Tarrask abused Windows scheduled task mechanisms to maintain
    hidden persistence on compromised servers.
  targets:
    sectors: [telecommunications, technology]
    regions: [United States]
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2022/04/12/tarrask-malware-uses-scheduled-tasks-for-defense-evasion/
    title: "Tarrask Malware Uses Scheduled Tasks for Defense Evasion"
    publisher: Microsoft

- name: Cloud Providers Campaign
  year_published: 2025
  description: >
    Since 2023, CrowdStrike observed HAFNIUM/Murky Panda targeting cloud environment, 
    "likely motivated by intelligence-collection requirements to gain access to sensitive information."
    CrowdStrike described the adversary as "cloud-conscious," for its abilities to operate in cloud environment.
  targets:
    sectors: [government, technology, academia, legal, professional services]
    regions: [United States]
  sources:
  - url: https://www.crowdstrike.com/en-us/blog/murky-panda-trusted-relationship-threat-in-cloud/
    title: "MURKY PANDA: A Trusted-Relationship Threat in the Cloud"
    publisher: CrowdStrike

- name: IT Supply Chain Campaign
  year_published: 2025
  description: >
    Microsoft documented HAFNIUM/Silk Typhoon's shift
    toward IT supply chain targeting, compromising IT services
    providers, RMM companies, and MSPs to reach downstream customer
    environments. The group used stolen API keys, compromised OAuth
    applications, and service principal abuse for lateral movement
    and data exfiltration. Victims included state and local
    government, IT services, and financial institutions.
  targets:
    sectors: [IT-services, managed-service-providers, government, financial]
    regions: [United States, global]
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2025/03/05/silk-typhoon-targeting-it-supply-chain/
    title: "Silk Typhoon Targeting IT Supply Chain"
    publisher: Microsoft Threat Intelligence

