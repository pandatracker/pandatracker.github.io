affiliation_detail: >
  According to DOJ indictment, HAFNIUM/Silk Typhoon operates on behalf of China's Ministry of State
  Security (MSS), specifically the Shanghai State Security
  Bureau (SSSB). On July 8, 2025, the DOJ unsealed an
  indictment charging two Chinese nationals: Xu Zewei (徐泽伟),
  employed by Shanghai Powerock Network Co. Ltd.; and Zhang Yu (张宇),
  employed by Shanghai Firetech Information Science and Technology
  Company, Ltd. Both, according to the indictment, operated under SSSB direction.

  Shanghai Powerock shut down on April 7, 2021 — approximately one month
  after Microsoft publicly attributed the Exchange Server attacks to
  HAFNIUM and China. Xu Zewei subsequently moved to Chaitin Tech (another
  cybersecurity firm) and later to Shanghai GTA Semiconductor Ltd.

