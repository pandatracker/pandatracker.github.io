# ---- Campaigns ----
campaigns:
- name: IXESHE Campaign (East Asia targeting)
  year_published: null
  description: >
    Trend Micro's documentation of APT12 activity. Spear phishing campaigns
    using malicious PDF and Word documents primarily targeting East Asian governments,
    Taiwanese electronics manufacturers, and a German telecommunications firm operating in
    Asia. The group amassed approximately 60 compromised C&C servers by 2012, mostly located
    in Taiwan and the United States. Distinctive use of compromised machines within target
    networks as C&C servers to disguise activity. HTRAN proxy tool used to mask true origin;
    one error traced to Guangdong, China.
  targets:
    sectors: [government, electronics-manufacturing, telecommunications]
    regions: [Taiwan, Japan, Germany]
  sources:
  - url: https://www.trendmicro.de/cloud-content/us/pdfs/security-intelligence/white-papers/wp_ixeshe.pdf
    title: "IXESHE: An APT Campaign"
    publisher: Trend Micro

- name: New York Times Breach
  year_published: null
  description: >
    APT12 infiltrated the New York Times' computer network beginning in
    October 2012, coinciding with the newspaper's investigation by Shanghai bureau chief
    David Barboza into the vast personal wealth accumulated by the family of then-Premier
    Wen Jiabao. The attackers compromised the email of Barboza and also targeted the South
    Asia bureau chief (previously Beijing bureau chief). APT12 ultimately stole the corporate
    passwords for every NYT employee. The attackers appeared primarily interested in identifying
    sources for the Wen Jiabao investigation rather than causing system damage. The computers
    used in the attack were reportedly the same university computers used by the Chinese military
    to attack U.S. military contractors. Mandiant was hired to investigate.
  targets:
    sectors: [media]
    regions: [United States]
  sources:
  - url: https://web.archive.org/web/20191224162418/https://www.fireeye.com/blog/threat-research/2013/08/survival-of-the-fittest-new-york-times-attackers-evolve-quickly.html
    title: "Survival of the Fittest: New York Times Attackers Evolve Quickly"
    publisher: FireEye/Mandiant

- name: Post-Arbor Retooling Campaign
  year_published: null
  description: >
    After Arbor Networks published a detailed analysis of RIPTIDE/Etumbot in June 2014,
    APT12 rapidly retooled — deploying the HIGHTIDE backdoor (a modified RIPTIDE variant)
    with changed drop locations, image base addresses, User-Agent strings, and URI formats.
    These changes specifically targeted the detection methods described in the Arbor report.
    FireEye observed HIGHTIDE at multiple Taiwan-based organizations and a suspected APT12
    WATERSPOUT backdoor at a Japan-based electronics company. This was the second documented
    instance of APT12 retooling after public disclosure.
  targets:
    sectors: [government, electronics-manufacturing]
    regions: [Taiwan, Japan]
  sources:
  - url: https://cloud.google.com/blog/topics/threat-intelligence/darwins-favorite-apt-group-2
    title: "Darwin's Favorite APT Group"
    publisher: FireEye/Mandiant

- name: CNACOM Watering Hole Campaign
  year_published: null
  description: >
    Zscaler documented a web-based campaign dubbed CNACOM specifically targeting Taiwanese
    government networks. The group compromised a major Taiwanese public service website,
    injecting a malicious iframe that loaded an exploit page. The exploit code (CVE-2016-0189)
    fingerprinted visitors, only delivering the payload if the IP address belonged to specific
    Taiwanese government network ranges. The payload was an updated IXESHE variant with SSL
    communication and without embedded campaign codes. Zscaler also identified a related
    2015 campaign exploiting the HackingTeam Flash exploit (CVE-2015-5122) targeting a
    different set of Taiwanese government networks. This represents a shift from APT12's
    traditional spear phishing to watering hole attacks while maintaining the same target set.
  targets:
    sectors: [government]
    regions: [Taiwan]
  sources:
  - url: https://www.zscaler.com/blogs/security-research/cnacom-open-source-exploitation-strategic-web-compromise
    title: "CNACOM Open Source Exploitation via Strategic Web Compromise"
    publisher: Zscaler

- name: Fukushima Reactor Incident Intelligence Collection
  year_published: null
  description: >
    CrowdStrike noted that Numbered Panda targeted organizations in operations
    related to the Fukushima Reactor Incident of 2011, likely filling intelligence gaps
    regarding cleanup and mitigation operations. Specific targets and extent not detailed.
  targets:
    sectors: [government, energy]
    regions: [Japan]
  sources:
  - url: https://www.crowdstrike.com/en-us/blog/whois-numbered-panda/
    title: "Whois Numbered Panda"
    publisher: CrowdStrike

