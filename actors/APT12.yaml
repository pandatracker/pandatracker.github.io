affiliation_detail: >
  APT12 is believed to be linked to the Chinese People's Liberation Army (PLA). FireEye/Mandiant
  stated that APT12's targets are "consistent with larger People's Republic of China (PRC) goals"
  and that campaigns are "in-line with PRC goals and self-interest in Taiwan." The NYT breach
  investigation found that computers used to launch the attack were believed to be the same
  university computers used by the Chinese military to attack U.S. military contractors.
  
  However, no DOJ indictment or formal government attribution to a specific PLA unit has been published.
  The PLA link remains an industry assessment based on targeting patterns, operational timing
  alignment with PRC strategic interests, and infrastructure overlap with known PLA-associated
  entities. No specific PLA unit designation has been publicly identified for APT12.
