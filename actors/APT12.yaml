# ---- Overview ----
description: >
  APT12 is a Chinese cyber espionage group believed to have links to the PLA, active since at
  least 2009. 

  The group primarily targets organizations in East Asia — especially Taiwan and Japan —
  as well as media outlets, and entities whose interests intersect with PRC strategic concerns. 

  APT12 is best known for its 2012 breach of the New York Times, launched in apparent retaliation for the
  newspaper's investigation into the wealth accumulated by the family of then-Premier Wen Jiabao.

  The group's defining operational characteristic is rapid adaptation to public disclosure.
  Mandiant dubbed APT12 "Darwin's Favorite APT Group" after observing the group retool its
  entire malware infrastructure at least twice in direct response to security vendor publications —
  first after the NYT breach exposure (2013), and again after Arbor Networks' detailed analysis
  of the Etumbot/RIPTIDE backdoor (2014). In both cases, APT12 paused operations only briefly
  before resuming with modified tooling specifically engineered to evade the detection methods
  described in the published research. 

  Based on the reports consulted, the group's spear-phishing lure documents are typically
  written in Traditional Chinese and pertain to Taiwanese government interests.

