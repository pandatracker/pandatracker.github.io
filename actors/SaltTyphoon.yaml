# ---- Overview ----
description: >
  Salt Typhoon is a Chinese state-sponsored espionage group that executed
  what the chairman of the Senate Intelligence Committee described as "the worst telecom hack in our
  nation's history." (Reuters, 2024) The group infiltrated at least nine major U.S.
  telecommunications companies — including Verizon, AT&T, T-Mobile, — as well
  as telecoms in over 80 countries, with the campaign running one to two
  years before discovery in late 2024.

  The group is believed to have compromised CALEA lawful
  intercept systems — the infrastructure used by U.S. law enforcement
  and intelligence agencies for court-authorized surveillance. This gave
  the group access to lists of individuals under surveillance, intercepted
  call content and text messages, and metadata. As of May 2026, no detailed technical reporting on the breach.
  Democratic Senator Maria Cantwell said Verizon and AT&T are blocking release of key documents. (Reuters, 2026)

  The group targets backbone infrastructure — Cisco routers
  handling major internet traffic, provider edge and customer edge
  routers — and modifies them for persistent long-term access.
  Custom tooling includes the GhostSpider backdoor for persistent access to telecom networks. (Trend Micro, 2024) 

  In May 2026, Bitdefender published a report describing Salt Typhoon/FamousSparrow targeting Azerbaijani oil and gas industry.
  The campagin, lasting between late December 2025 through late February 2026, exploited Microsoft Exchange server entry point vulnerability to deploy
  "two distinct backdoor families, Deed RAT and Terndoor."

  OFAC sanctioned Sichuan Juxinhe Network Technology for direct
  involvement. The August 2025 CISA advisory identified two additional
  Chinese companies providing services to PLA and MSS units. In November
  2025, Australia's ASIO director confirmed Salt Typhoon had targeted
  Australian telecommunications networks.

