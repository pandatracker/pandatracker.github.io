# ---- Campaigns----
campaigns:
- name: U.S. Telecommunications Mass Breach & Global Telecom and Infrastructure Targeting
  year_published: 2024
  description: >
    Salt Typhoon infiltrated at least nine major U.S. telecom
    providers (Verizon, AT&T, T-Mobile, Spectrum, Lumen, Consolidated
    Communications, Windstream) over one to two years. Compromised
    CALEA lawful intercept systems, accessing surveillance target
    lists, call content, text messages, and metadata on 1M+ users
    including senior government officials. Verizon and
    AT&T announced containment in December 2024. FBI Director Wray
    stated the group could not be fully expelled from most systems.
    White House established Cyber UCG on October 8, 2024. Congress
    approved $3B to remove Chinese equipment from U.S. telecom
    networks.

    Beyond U.S. targets, Salt Typhoon has infiltrated telecoms in
    over 80 countries and several dozen were compromised. Targets
    include government agencies, hotels, transportation, and military
    infrastructure worldwide. ESET documented hotel and government
    breaches globally. In November 2025, Australia's ASIO confirmed
    targeting of Australian telecom networks. A Canadian telecom was
    breached in February 2025. Viasat (U.S. satellite telecom) was
    named as a victim in June 2025.
