affiliation_detail: >
  Believed to be controlled by China's Ministry of State Security (MSS). On
  January 17, 2025, OFAC sanctioned Sichuan Juxinhe Network Technology
  Co., Ltd. (四川聚信和网络科技有限公司) for "direct involvement in the Salt Typhoon cyber group." 
  
  The August 2025 CISA multinational advisory linked the
  activity to at least three Chinese entities: Sichuan Juxinhe, Beijing
  Huanyu Tianqiong Information Technology Co., Ltd. (北京寰宇天穹信息技
  术有限公司), and Sichuan Zhixin Ruijie Network Technology Co., Ltd.
  (四川智信锐捷网络科技有限公司). According to the CISA advisory, these companies provide cyber products
  and services to multiple PLA and MSS units.

  No individuals have been publicly indicted specifically for Salt
  Typhoon telecom intrusions. However, according to a 2025 SpyCloud report, leaked datasets appearing on
  DarkForums in 2025 contained non-public documents related to VenusTech
  (a Chinese IT security vendor serving government clients) and Salt
  Typhoon, including contract information showing various Chinese
  government entities as clients.
