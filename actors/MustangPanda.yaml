# ---- Overview ----
description: >
  According to U.S. DOJ documents, Mustang Panda is Chinese state-aligned espionage group active since at least 2012. The group
  targets government, diplomatic, NGO, religious, think tank, and
  research organizations across the U.S., Europe, and Asia, with
  particular focus on countries along China's periphery and entities
  relevant to Chinese strategic interests.

  The group frequently utilizes tool PlugX, a modular RAT shared across
  Chinese groups since 2008 but deployed by Mustang Panda in customized
  variants, including a USB-propagating version that targets
  air-gapped networks. (Trend Micro, 2024)
   
  In January 2025, FBI/DOJ/French law
  enforcement, together with the French cybersecurity company Sekoia.io, 
  launched the operation to delete PlugX from computers worldwide. Approximately 4,258 U.S.
  computers were cleaned.

  Mustang Panda is highly reactive to geopolitical events, which are exploited for its initial access vector through phishing lures: Vatican and
  Catholic organizations during China-Vatican negotiations (2020); governments during the Ukraine invasion (2022); 
  ASEAN-Australia Summit attendees (2024); Thailand military during the
  Thailand-Cambodia border conflict (2025); and U.S. policy
  organizations using Venezuela-themed lures (January 2026).

  In June 2026, Acronis reported that Mustang Panda targeted India's government and energy sectors with two newly identified malware tools. The spear phishing lure used exploited existing hydropower cooperation between India and Taiwan. (Acronis, 2026) 

