affiliation_detail: >
  No DOJ indictment or formal government attribution to a specific Chinese intelligence
  agency has been published for APT15. The group is broadly attributed to China-based actors.
  Microsoft described NICKEL as a "China-based threat actor" and stated there is "often a
  correlation between Nickel's targets and China's geopolitical interests." 
  FireEye originally described Ke3chang operators as "Chinese-speaking APT actors." 

  In July 2026, Intrusion Truth attributed APT15 to PLA 8th Technical Reconnaissance Base (Unit 61046), 
  based on their investigation into RedRelay anonymization network, which they observed being sold to Unit 61046.
