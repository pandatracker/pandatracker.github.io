# ---- Campaigns ----
campaigns:
- name: Operation Ke3chang (European Foreign Ministries)
  year_published: null
  description: >
    FireEye documented systematic targeting of European ministries of foreign affairs (MFAs)
    by Chinese-speaking APT actors. The campaign leveraged spear phishing with themes related
    to the Syria crisis to deliver BS2005, BMW, and MyWeb backdoors. FireEye accessed one of
    23 C2 servers and found evidence of targeting across multiple European countries. Activity
    was traced back to at least 2010, including targeting related to a G20 meeting concerning
    the Irish debt crisis. After the December 2013 report publication, attackers continued with
    updated MyWeb variants and new infrastructure, including domains referencing French media
    outlets (Le Monde, Telerama).
  targets:
    sectors: [government, diplomatic]
    regions: [Europe]
  sources:
  - url: https://www.mandiant.com/resources/operation-ke3chang-targeted-attacks-against-ministries-of-foreign-affairs
    title: "Operation Ke3chang"
    publisher: FireEye/Mandiant

- name: Indian Embassy Targeting (TidePool)
  year_published: null
  description: >
    Palo Alto Unit 42 discovered ongoing Ke3chang campaigns targeting Indian embassy personnel
    worldwide using the TidePool malware, an evolution of BS2005. Spear phishing emails used
    decoy documents referencing an annual report filed by over 30 Indian embassies. Delivered
    via CVE-2015-2545 exploit in MHTML documents.
  targets:
    sectors: [government, diplomatic]
    regions: [India]
  sources:
  - url: https://unit42.paloaltonetworks.com/operation-ke3chang-resurfaces-with-new-tidepool-malware/
    title: "Operation Ke3chang Resurfaces With New TidePool Malware"
    publisher: Palo Alto Networks Unit 42

- name: UK Government Contractor Compromise (RoyalCli/RoyalDNS)
  year_published: null
  description: >
    NCC Group responded to an active compromise of a UK government contractor by APT15.
    Sensitive documents related to UK government departments and military technology were
    stolen. APT15 used BS2005 alongside new backdoors RoyalCli and RoyalDNS. After NCC
    Group's initial remediation, APT15 regained access within two weeks via the corporate
    VPN using a stolen VPN certificate extracted from a compromised host, deploying the
    DNS-based RoyalDNS backdoor. NCC Group recovered over 200 attacker commands showing
    extensive use of living-off-the-land techniques. Tools included Mimikatz (for Kerberos
    golden tickets), WinRAR, and the bespoke spwebmember SharePoint dumping tool.
  targets:
    sectors: [government, military, defense]
    regions: [United Kingdom]
  sources:
  - url: https://research.nccgroup.com/2018/03/10/apt15-is-alive-and-strong-an-analysis-of-royalcli-and-royaldns/
    title: "APT15 is Alive and Strong"
    publisher: NCC Group

- name: European Diplomatic Missions (Ketrican/Okrum)
  year_published: null
  description: >
    ESET tracked Ke3chang activity across Central and South America and Europe from 2015
    through 2019, discovering the previously unknown Okrum backdoor (active since December
    2016) and multiple generations of Ketrican malware (BS2005 evolution). Targets included
    diplomatic missions in Slovakia, Belgium, Chile, Guatemala, and Brazil. ESET established
    code lineage connecting Ketrican, Okrum, RoyalDNS, and BS2005.
  targets:
    sectors: [government, diplomatic]
    regions: [Slovakia, Belgium, Chile, Guatemala, Brazil, Croatia, Czech Republic]
  sources:
  - url: https://www.welivesecurity.com/2019/07/18/okrum-ke3chang-targets-diplomatic-missions/
    title: "Okrum: Ke3chang group takes aim at diplomatic missions"
    publisher: ESET

- name: NICKEL Global Campaign (Microsoft Domain Seizure)
  year_published: null
  description: >
    Microsoft tracked NICKEL/APT15 operations targeting governments, diplomatic entities, and
    NGOs across 29 countries in Central/South America, the Caribbean, Europe, and North
    America. The group exploited unpatched Exchange Server, SharePoint, and VPN appliances
    for initial access. Microsoft obtained a court order from the Eastern District of Virginia
    to seize 42 domains. NICKEL deployed hard-to-detect malware (including Leeson backdoor)
    for surveillance and data theft, used Mimikatz and WDigest for credential harvesting,
    and conducted automated, scheduled data collection and exfiltration.
  targets:
    sectors: [government, diplomatic, NGOs, think-tanks]
    regions: [United States, Argentina, Barbados, Bosnia and Herzegovina, Brazil, Bulgaria, Chile, Colombia, Croatia, 
        Czech Republic, Dominican Republic, Ecuador, El Salvador, France, Guatemala, Honduras, Hungary, Italy, Jamaica, 
        Mali, Mexico, Montenegro, Panama, Peru, Portugal, Switzerland, Trinidad and Tobago, United Kingdom, Venezuela]
  sources:
  - url: 
      https://www.microsoft.com/security/blog/2021/12/06/nickel-targeting-government-organizations-across-latin-america-and-europe
    title: "NICKEL targeting government organizations across Latin America and Europe"
    publisher: Microsoft

- name: SPACEHOP Activity (ORB Network Usage)
  year_published: null
  description: >
    MITRE ATT&CK documents a campaign where Ke3chang utilized an ORB (operational relay box)
    network — a mesh of compromised devices and VPS infrastructure — for reconnaissance and
    vulnerability exploitation. Mandiant/Google Cloud documented this as part of broader
    research into China-nexus espionage use of ORB networks.
  targets:
    sectors: [government]
    regions: [unknown]
  sources:
  - url: https://cloud.google.com/blog/topics/threat-intelligence/china-nexus-espionage-orb-networks
    title: "China-nexus espionage ORB networks"
    publisher: Mandiant/Google Cloud

