# ---- Overview ----
description: >
  APT15 is a Chinese cyber espionage group that has been active since at least 2010, primarily
  targeting government, diplomatic, military, and NGO entities. 

  The group is best known for "Operation Ke3chang" (2013), which documented systematic targeting of European foreign ministries
  during the Syria crisis. In 2021 a U.S. court ordered Microsoft to seize 42 domains used to target organizations in 29 countries.
  In 2023, Symatec reported that APT15 continued its focus on foreign ministried throughout 2022 and early 2023, leveraging a new backdoor called Backdoor.Graphican. 
  
  The group's focus on
  diplomatic targets, foreign ministries, government intelligence, and human rights organizations
  across Latin America, Europe, and Asia is consistent with MSS intelligence collection priorities. 
  However, no specific MSS bureau or front company has been publicly identified.

  NCC group characterizes APT15 by its preference for "living off the land" — using native Windows
  commands and tools for reconnaissance and lateral movement rather than deploying extensive
  custom malware. Moreover, APT15 is notable for its persistence — NCC Group documented the group regaining access to a compromised UK government contractor
  within two weeks of remediation via a stolen VPN certificate. 

  In July 2026, Intrusion Truth linked APT15 to PLA's "Unit 61046 ... otherwise known as the 8th TRB," through the investigation of anonymization tool RedRelay
  and subsequent leaked documents from a notetaking tool, which mentioned IP address hosting infrastructure "believed to be used exclusively by APT15."

  Side note:

  It is worth noting that Unit 61046 was pre-2015 known as the 8th Operational Bureau of the General Staff Department (GSD) Third Department. 
  Technical Reconnaissance Bueraus (TRB) were distinct from Operational Bureaus and were assigned to respective Military Regions (pre-reform).
  According to Project2049, "Third Department likely provides TRBs with policy guidance and tasking for collection and analysis."
  Notes investigated by Intrusion Truth mention 8th TRB of Strategic Support Force (SSF) and do not provide any dating. 
  However, SSF existed between 2015 and 2024, when it was replaced by Cyber Space Force (CSF). SSF 8th TRB was not previously noticed in open sources, 
  which however does not mean it did not exist. Moreover, 8th TRB was not observed as a part of CSF post-2024 reform. Again, not meaning it does not exist,
  given the secrecy of PLA.

