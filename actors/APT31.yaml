# ---- Campaigns ----
campaigns:
- name: 2020 U.S. Presidential Election Targeting
  year_published: null
  description: >
    Google's Threat Analysis Group and Microsoft reported in September-
    October 2020 that APT31/Zirconium was targeting individuals associated
    with the 2020 U.S. presidential election, including staffers of both
    the Biden and Trump campaigns. The group used credential phishing
    emails containing tracking links. Google stated the attacks were
    unsuccessful but represented a significant election interference
    attempt.
  targets:
    sectors: [government]
    regions: [United States]
  sources:
  - url: https://blog.google/threat-analysis-group/how-were-tackling-evolving-online-threats/
    title: "How We're Tackling Evolving Online Threats"
    publisher: Google Threat Analysis Group
  - url: https://blogs.microsoft.com/on-the-issues/2020/09/10/cyberattacks-us-elections-trump-biden/
    title: "New cyberattacks targeting U.S. elections"
    publisher: Microsoft

- name: Finnish Parliament Breach
  year_published: null
  description: >
    Finland's Security Intelligence Service (Supo) publicly attributed a
    cyber espionage operation against the Finnish Parliament to APT31 in
    March 2021. The breach targeted parliamentary email accounts and
    information systems. This was one of the first European government
    attributions of APT31 activity and signaled the group's expanding
    targeting beyond U.S.-focused operations.
  targets:
    sectors: [government]
    regions: [Finland]
  sources:
  - url: https://supo.fi/en/-/supo-identified-the-cyber-espionage-operation-against-the-parliament-as-apt31
    title: "Supo identified the cyber espionage operation against the parliament as APT31"
    publisher: Suojelupoliisi (Supo)

- name: France-Wide Intrusion Campaign (ANSSI/Pakdoor)
  year_published: 2021
  description: >
    ANSSI documented a large-scale campaign against numerous French
    entities beginning in January 2021. APT31 used a mesh network of
    approximately 1,000 compromised SOHO routers managed via the Pakdoor
    backdoor as an anonymization layer, enabling attacks to appear to
    originate from the target's own national IP space. The full infection
    chain included web shell deployment, CVE-2021-26885 exploitation,
    Juicy Potato privilege escalation, and Cobalt Strike for DNS-based
    exfiltration. ANSSI found no targeting criteria — the campaign
    appeared opportunistic in victim selection.
  targets:
    sectors: [government, technology, telecommunications]
    regions: [France]
  sources:
  - url: https://www.cert.ssi.gouv.fr/cti/CERTFR-2021-CTI-013/
    title: "APT31 Intrusion Set Campaign"
    publisher: ANSSI / CERT-FR

- name: UK Parliamentary and Electoral Commission Targeting
  year_published: 2024
  description: >
    APT31 targeted email accounts of members of the Inter-Parliamentary
    Alliance on China (IPAC), including 43 UK parliamentary accounts, most
    belonging to outspoken critics of the Chinese government. The UK
    government assessed this reconnaissance activity as "almost certain"
    to be APT31. Separately, the UK attributed the 2021-2022 breach of
    the Electoral Commission — which exposed voter data of approximately
    40 million people — as "highly likely" conducted by a China state-
    affiliated actor, with APT31 identified in the associated sanctions
    action. The breach was not disclosed until August 2023.
  targets:
    sectors: [government, diplomatic]
    regions: [United Kingdom]
  sources:
  - url: https://www.gov.uk/government/news/uk-holds-china-state-affiliated-organisations-and-individuals-responsible-for-malicious-cyber-activity
    title: "UK Holds China State-Affiliated Organisations Responsible"
    publisher: Foreign, Commonwealth and Development Office

- name: 14-Year Global Espionage Campaign (DOJ Indictment)
  year_published: null
  description: >
    The campaign described in the March 2024 DOJ indictment
    spanning from 2010 through January 2024. APT31 sent more than 10,000
    malicious emails impersonating journalists and news outlets, targeting
    White House staff, multiple U.S. cabinet departments, Congressional
    members of both parties, defense contractors, seven managed service providers, energy
    companies, Hong Kong pro-democracy activists, Uyghur community
    members, Norwegian government officials, and IPAC parliamentarians
    worldwide. The group compromised subsidiary networks to pivot into
    parent defense contractors and used MSP access to reach downstream
    customers including a nuclear power engineering company.
  targets:
