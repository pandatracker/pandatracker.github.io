# ---- Overview ----
description: >
  Per U.S. DOJ indictment, APT31 is a Chinese state-sponsored cyber espionage group operating on behalf
  of the Ministry of State Security's Hubei State Security Department (HSSD)
  through the front company Wuhan Xiaoruizhi Science and Technology Company
  (Wuhan XRZ), established in 2010. 

  Over approximately 15 years, the group
  conducted global campaigns of computer hacking targeting political
  dissidents and their perceived supporters, government officials across
  multiple countries, election-related entities, and private companies in
  defense, technology, telecommunications, energy, and finance sectors.

  According to the indictment, APT31 was sending more than 10,000 malicious emails
  impersonating journalists and news outlets, containing hidden tracking links
  to profile targets and collect victim metadata (IP addresses,
  device types, locations), then used this intelligence to conduct targeted
  exploitation of victims' home routers and personal devices.

  APT31's operations include the targeting of
  the 2020 U.S. presidential election campaigns (Google TAG, 2020;
  Microsoft, 2020), the 2020-2021 breach of the Finnish Parliament (Supo, 2021), 
  the 2021 compromise of email accounts belonging to the Inter-
  Parliamentary Alliance on China (IPAC) including 43 UK parliamentary
  accounts, the 2021-2022 breach of the UK Electoral Commission exposing 40
  million voter records (assessed as "highly likely" by the UK government),
  and a multi-year campaign against the Czech Foreign Ministry disclosed in
  May 2025. (NUKIB, 2025)

  Check Point Research revealed in February 2021 that APT31 had cloned an exploit codenamed "EpMe" (allegedly developed by the NSA Tailored Access Opereations unit) to create its own tool "Jian," which was used from at least 2015 until caught in 2017
  when Lockheed Martin reported it to Microsoft. 

  In February 2026 Google Threat Intelligence Group (GTIG) observed APT31 misusing Google Gemini AI "to automate the analysis of vulnerabilities and generate targeted testing plans." 

