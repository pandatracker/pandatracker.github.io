# ---- Overview ----
description: >
  BRONZE BUTER/Tick is a suspected Chinese cyber espionage group active since at
  least 2006, primarily focused on intellectual property and
  classified information from Japanese organizations. The group also
  targets entities in South Korea, and to a lesser extent Russia,
  Singapore, and Taiwan. (Symantec, 2016; Trend Micro, 2017; SecureWorks,
  2017) In 2023, Japanese law enforcement attributed Tick to PLA Unit 61419, 
  a unit stationed in Qingdao, Shandong Province. (The Record, 2023)

  SecureWorks' 2017 analysis documented the group's focus on
  "critical infrastructure, heavy industry, manufacturing, and international
  relations" in Japan, noting that "the diverse targeting suggests that
  the group may be tasked by multiple teams or organizations with
  varying priorities." (SecureWorks, 2017) The group is distinguished by
  its deep knowledge of Japan-specific software: it exploited a zero-day
  in the Japanese asset management product SKYSEA Client View in 2016,
  and in mid-2025 exploited another zero-day in the
  widely deployed Motex LANSCOPE Endpoint Manager. (SecureWorks/Sophos, 2025)

  In 2019, Trend Micro documented Operation ENDTRADE, which targeted defense, aerospace,
  chemical, and satellite industries with multi-stage backdoors. (Trend
  Micro, 2019)

  In 2021, ESET identified Tick as one of the first groups to exploit the
  ProxyLogon vulnerability in Microsoft Exchange, targeting a South Korean
  IT company before public patch availability. (ESET, 2021) Subsequently,
  Tick compromised an East Asian DLP software developer serving government
  and military clients, deploying the previously undocumented ShadowPy
  downloader and trojanizing legitimate installers that were transferred to two downstream customers via
  remote support tools. (ESET, 2023)

  In 2021, Recorded Future’s Insikt Group has discovered procurement documents 
  that show the PLA Unit 61419 associated with Tick seeking "to purchase antivirus software from several major American, European, and Russian security companies,"
  likely "as a testing environment for natively developed malware" or "to find previously undisclosed vulnerabilities." (Recorded Future, 2021)

