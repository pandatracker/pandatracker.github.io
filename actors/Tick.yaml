affiliation_detail: >
  SecureWorks assessed "with moderate confidence" that BRONZE BUTLER
  "operates on behalf of China," based on Chinese characters in malware
  strings, documented links between the group's Daserf tool and the
  PRC-based NCPH hacking group, and a decrease in activity during PRC
  national holidays. (SecureWorks, 2017)

  In April 2021, Japan's Ministry of Foreign Affairs announced that cyberattack 
  on Japan Aerospace Exploration Agency (JAXA) was "highly likely" conducted by Tick, 
  stating that "the Unit 61419 of the Chinese People's Liberation Army is behind" 
  the group. (MOFA JP, 2021; Recorded Future 2021)

  Recorded Future's Insikt Group
  noted that TAG-74's (reportedly overlapping with Tonto Team, suspected affiliation to PLA) tool ReVBShell is "very likely" shared
  with Tick. (Recorded Future, 2023)
