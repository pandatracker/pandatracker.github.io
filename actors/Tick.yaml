# ---- Campaigns ----
campaigns:
  - name: SKYSEA Client View Zero-Day Exploitation
    year_published: 2017
    description: >
      SecureWorks documented Tick exploiting a zero-day vulnerability
      (CVE-2016-7836) in SKYSEA Client View, a popular Japanese asset
      management product, from June 2016 through at least February 2019.
      The vulnerability allowed remote code execution on systems exposed
      to the internet. JPCERT/CC observed scanning activity exclusively
      targeting Japanese IP addresses.
    targets:
      sectors: [government, manufacturing, critical-infrastructure]
      regions: [Japan]
    sources:
      - url: https://www.secureworks.com/research/bronze-butler-targets-japanese-businesses
        title: "BRONZE BUTLER Targets Japanese Enterprises"
        publisher: SecureWorks

  - name: Operation ENDTRADE
    year_published: 2019
    description: >
      Trend Micro identified a campaign targeting defense, aerospace,
      chemical, and satellite industries — specifically organizations
      with head offices in Japan and subsidiaries in China. The group
      deployed new multi-stage backdoors and used compromised legitimate
      email accounts for malware delivery, targeting industries holding
      classified information.
    targets:
      sectors: [defense, aerospace, manufacturing, technology]
      regions: [Japan]
    sources:
      - url: https://www.trendmicro.com/en_us/research/19/k/operation-endtrade-finding-multi-stage-backdoors-that-tick.html
        title: "Operation ENDTRADE"
        publisher: Trend Micro

  - name: DLP Software Developer Supply Chain Compromise
    year_published: 2023
    description: >
      ESET documented Tick compromising an East Asian DLP software
      developer whose customer portfolio included government and military
      entities. Beginning March 2021, the group deployed Netboy, Ghostdown,
      and ShadowPy, then trojanized Q-Dir installers and compromised
      internal update servers. In February and June 2022, the malicious
      installers were transferred to two downstream customers (engineering
      and manufacturing firms) via remote support tools. Tick also exploited
      ProxyLogon to compromise a South Korean IT company around the same
      time.
    targets:
      sectors: [technology, government, military, manufacturing]
      regions: [East Asia, South Korea]
    sources:
      - url: https://www.welivesecurity.com/2023/03/14/slow-ticking-time-bomb-tick-apt-group-dlp-software-developer-east-asia/
        title: "The Slow Tick-ing Time Bomb"
        publisher: ESET

  - name: LANSCOPE Endpoint Manager Zero-Day Campaign
    year_published: 2025
    description: >
      SecureWorks/Sophos CTU observed BRONZE BUTLER exploiting
      CVE-2025-61932, a critical zero-day (CVSS 9.8) in Motex LANSCOPE
      Endpoint Manager — a platform deployed by one in four listed
      companies and one in three financial institutions in Japan. The
      group deployed an updated Gokcpdoor backdoor with multiplexed
      communications and the Havoc C2 framework. CISA added the CVE to
      the KEV catalog on October 22, 2025.
    targets:
      sectors: [government, finance, manufacturing, technology]
      regions: [Japan]
    sources:
      - url: https://www.sophos.com/en-us/blog/bronze-butler-exploits-japanese-asset-management-software-vulnerability
        title: "BRONZE BUTLER Exploits Japanese Asset Management Software Vulnerability"
        publisher: SecureWorks / Sophos CTU

