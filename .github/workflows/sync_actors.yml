name: Sync Actor Data

on:
  push:
    branches: [main]
    paths:
      - "actors/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Download enterprise-attack.json
        run: |
          curl -L \
            "https://raw.githubusercontent.com/mitre/cti/master/enterprise-attack/enterprise-attack.json" \
            -o enterprise-attack.json

      - name: Export static data
        run: |
          python scripts/export_static.py \
            --actors actors \
            --stix   enterprise-attack.json \
            --out    frontend/public/data

      - name: Remove STIX file
        run: rm enterprise-attack.json

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/groups.json \
                  frontend/public/data/groups/ \
                  frontend/public/data/attack/ \
                  frontend/public/data/graph.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate data from actors [skip ci]"
            git push
          fi
