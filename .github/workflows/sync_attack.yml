name: Sync MITRE ATT&CK Data

on:
  schedule:
    # 1st of every month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-attack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Download latest enterprise-attack.json
        run: |
          curl -L \
            "https://raw.githubusercontent.com/mitre/cti/master/enterprise-attack/enterprise-attack.json" \
            -o enterprise-attack.json
          echo "Downloaded $(wc -c < enterprise-attack.json) bytes"

      - name: Export static MITRE + graph data
        run: |
          python scripts/export_static.py \
            --actors actors \
            --stix   enterprise-attack.json \
            --out    frontend/public/data

      - name: Remove downloaded STIX file
        run: rm enterprise-attack.json

      - name: Commit updated MITRE and graph data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/attack/ \
                  frontend/public/data/graph.json \
                  frontend/public/data/groups.json \
                  frontend/public/data/groups/
          if git diff --staged --quiet; then
            echo "No MITRE changes to commit."
          else
            git commit -m "chore: update MITRE ATT&CK data [skip ci]"
            git push
          fi
