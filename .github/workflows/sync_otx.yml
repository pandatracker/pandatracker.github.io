name: Sync OTX Pulses

on:
  schedule:
    # Every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-otx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Probe OTX search endpoint
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
        run: |
          python - <<'EOF'
          import os, time, requests
          key = os.environ["OTX_API_KEY"]
          s = requests.Session()
          s.headers.update({"X-OTX-API-KEY": key, "Accept": "application/json", "User-Agent": "OTXv2 Python SDK"})
          t0 = time.time()
          try:
              r = s.get("https://otx.alienvault.com/api/v1/search/pulses", params={"q": "APT41", "limit": 5}, timeout=120)
              elapsed = time.time() - t0
              print(f"Search probe: HTTP {r.status_code} in {elapsed:.1f}s — {len(r.json().get('results', []))} results")
          except Exception as e:
              elapsed = time.time() - t0
              print(f"Search probe: FAILED after {elapsed:.1f}s — {e}")
          EOF

      - name: Sync OTX pulses
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
        run: |
          python scripts/sync_otx.py \
            --actors actors \
            --out    frontend/public/data

      - name: Commit updated OTX data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/otx/
          if git diff --staged --quiet; then
            echo "No OTX changes to commit."
          else
            git commit -m "chore: update OTX pulse data"
            git push
          fi
