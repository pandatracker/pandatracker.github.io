name: Sync OTX Pulses

on:
  schedule:
    # Every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-otx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync OTX pulses
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
        run: |
          python scripts/sync_otx.py \
            --actors actors \
            --out    frontend/public/data

      - name: Commit updated OTX data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/otx/
          if git diff --staged --quiet; then
            echo "No OTX changes to commit."
          else
            git commit -m "chore: update OTX pulse data [skip ci]"
            git push
          fi
