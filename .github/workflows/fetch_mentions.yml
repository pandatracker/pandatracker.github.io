name: Fetch Group Mentions

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-mentions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch per-group mentions
        run: |
          python scripts/fetch_news.py \
            --actors actors \
            --feeds  scripts/feeds.yaml \
            --out    frontend/public/data \
            --mode   mentions

      - name: Commit updated mentions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/news/
          if git diff --staged --quiet; then
            echo "No mention changes to commit."
          else
            git commit -m "chore: update group mentions"
            git push
          fi
